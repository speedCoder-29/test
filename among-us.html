    function drawFloorTiles(x, y, w, h) {
      ctx.strokeStyle = 'rgba(255,255,255,0.035)';
      ctx.lineWidth = 1;
      for (let tx = 0; tx < w; tx += 40) {
        ctx.beginPath(); ctx.moveTo(x + tx, y); ctx.lineTo(x + tx, y + h); ctx.stroke();
      }
      for (let ty = 0; ty < h; ty += 40) {
        ctx.beginPath(); ctx.moveTo(x, y + ty); ctx.lineTo(x + w, y + ty); ctx.stroke();
      }
      // Subtle rivet dots at intersections
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      for (let tx = 40; tx < w; tx += 80) {
        for (let ty = 40; ty < h; ty += 80) {
          ctx.fillRect(x + tx - 1, y + ty - 1, 2, 2);
        }
      }
    }

    function drawHallwayDetail(x, y, w, h) {
      const horiz = w > h;
      const len = horiz ? w : h;
      const thick = horiz ? h : w;
      const isSmall = thick <= 20;

      if (isSmall) {
        // Very thin connector - just a simple fill
        ctx.fillStyle = 'rgba(255,255,255,0.02)';
        ctx.fillRect(x, y, w, h);
        return;
      }

      // === BASE FLOOR PLATE PATTERN ===
      // Metal floor plates / grating
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      const plateSize = 32;
      if (horiz) {
        for (let px = 0; px < w; px += plateSize) {
          ctx.beginPath(); ctx.moveTo(x + px, y); ctx.lineTo(x + px, y + h); ctx.stroke();
        }
        for (let py = 0; py < h; py += plateSize) {
          ctx.beginPath(); ctx.moveTo(x, y + py); ctx.lineTo(x + w, y + py); ctx.stroke();
        }
      } else {
        for (let px = 0; px < w; px += plateSize) {
          ctx.beginPath(); ctx.moveTo(x + px, y); ctx.lineTo(x + px, y + h); ctx.stroke();
        }
        for (let py = 0; py < h; py += plateSize) {
          ctx.beginPath(); ctx.moveTo(x, y + py); ctx.lineTo(x + w, y + py); ctx.stroke();
        }
      }

      // === EDGE LIGHTING STRIPS ===
      if (selectedMap === 'skeld' || selectedMap === 'airship' || selectedMap === 'mira') {
        // Glowing edge strips (like ship corridor lighting)
        const stripColor = selectedMap === 'mira' ? 'rgba(80,180,255,0.08)' :
                           selectedMap === 'airship' ? 'rgba(255,180,80,0.07)' :
                           'rgba(120,160,255,0.07)';
        ctx.fillStyle = stripColor;
        if (horiz) {
          ctx.fillRect(x, y, w, 4);
          ctx.fillRect(x, y + h - 4, w, 4);
          // Brighter inner glow line
          ctx.fillStyle = stripColor.replace(/[\d.]+\)$/, (parseFloat(stripColor.match(/[\d.]+\)$/)[0]) * 1.5).toFixed(2) + ')');
          ctx.fillRect(x, y + 1, w, 1);
          ctx.fillRect(x, y + h - 2, w, 1);
        } else {
          ctx.fillRect(x, y, 4, h);
          ctx.fillRect(x + w - 4, y, 4, h);
          ctx.fillStyle = stripColor.replace(/[\d.]+\)$/, (parseFloat(stripColor.match(/[\d.]+\)$/)[0]) * 1.5).toFixed(2) + ')');
          ctx.fillRect(x + 1, y, 1, h);
          ctx.fillRect(x + w - 2, y, 1, h);
        }
      }

      // === EDGE PIPE / CONDUIT ===
      ctx.fillStyle = 'rgba(255,255,255,0.025)';
      if (horiz) {
        ctx.fillRect(x, y + 5, w, 2);
        ctx.fillRect(x, y + h - 7, w, 2);
      } else {
        ctx.fillRect(x + 5, y, 2, h);
        ctx.fillRect(x + w - 7, y, 2, h);
      }

      // === DIRECTIONAL ARROWS ===
      if (len >= 100 && thick >= 50) {
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        const arrowSpacing = 60;
        const arrowSize = Math.min(thick * 0.2, 10);
        if (horiz) {
          for (let ax = 30; ax < w - 20; ax += arrowSpacing) {
            ctx.beginPath();
            ctx.moveTo(x + ax + arrowSize, y + h / 2);
            ctx.lineTo(x + ax - arrowSize, y + h / 2 - arrowSize);
            ctx.lineTo(x + ax - arrowSize * 0.3, y + h / 2);
            ctx.lineTo(x + ax - arrowSize, y + h / 2 + arrowSize);
            ctx.closePath();
            ctx.fill();
          }
        } else {
          for (let ay = 30; ay < h - 20; ay += arrowSpacing) {
            ctx.beginPath();
            ctx.moveTo(x + w / 2, y + ay + arrowSize);
            ctx.lineTo(x + w / 2 - arrowSize, y + ay - arrowSize);
            ctx.lineTo(x + w / 2, y + ay - arrowSize * 0.3);
            ctx.lineTo(x + w / 2 + arrowSize, y + ay - arrowSize);
            ctx.closePath();
            ctx.fill();
          }
        }
      }

      // === CENTER LINE (dashed) ===
      if (thick >= 60) {
        ctx.strokeStyle = 'rgba(255,200,50,0.045)';
        ctx.lineWidth = 1;
        ctx.setLineDash([8, 12]);
        ctx.beginPath();
        if (horiz) {
          ctx.moveTo(x, y + h / 2);
          ctx.lineTo(x + w, y + h / 2);
        } else {
          ctx.moveTo(x + w / 2, y);
          ctx.lineTo(x + w / 2, y + h);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // === CORNER BOLTS / RIVETS ===
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      const boltInset = 6;
      const boltR = 1.5;
      if (thick >= 40) {
        // Corner bolts
        ctx.beginPath(); ctx.arc(x + boltInset, y + boltInset, boltR, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + w - boltInset, y + boltInset, boltR, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + boltInset, y + h - boltInset, boltR, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + w - boltInset, y + h - boltInset, boltR, 0, Math.PI * 2); ctx.fill();
        // Mid-point bolts along edges for longer hallways
        if (len > 120) {
          if (horiz) {
            for (let bx = 60; bx < w; bx += 60) {
              ctx.beginPath(); ctx.arc(x + bx, y + boltInset, boltR, 0, Math.PI * 2); ctx.fill();
              ctx.beginPath(); ctx.arc(x + bx, y + h - boltInset, boltR, 0, Math.PI * 2); ctx.fill();
            }
          } else {
            for (let by = 60; by < h; by += 60) {
              ctx.beginPath(); ctx.arc(x + boltInset, y + by, boltR, 0, Math.PI * 2); ctx.fill();
              ctx.beginPath(); ctx.arc(x + w - boltInset, y + by, boltR, 0, Math.PI * 2); ctx.fill();
            }
          }
        }
      }

      // === MAP-SPECIFIC HALLWAY DETAILS ===
      if (selectedMap === 'polus') {
        // Snow tracks / footprints
        ctx.fillStyle = 'rgba(200,220,255,0.05)';
        const stepSpacing = 35;
        if (horiz) {
          for (let sx = 15; sx < w - 10; sx += stepSpacing) {
            ctx.beginPath(); ctx.ellipse(x + sx, y + h * 0.35, 5, 3, 0.2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(x + sx + 12, y + h * 0.6, 5, 3, -0.2, 0, Math.PI * 2); ctx.fill();
          }
        } else {
          for (let sy = 15; sy < h - 10; sy += stepSpacing) {
            ctx.beginPath(); ctx.ellipse(x + w * 0.35, y + sy, 3, 5, 0.2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(x + w * 0.6, y + sy + 12, 3, 5, -0.2, 0, Math.PI * 2); ctx.fill();
          }
        }
        // Ice crystal accents on edges
        ctx.fillStyle = 'rgba(180,220,255,0.04)';
        for (let i = 0; i < len; i += 45) {
          const ix = horiz ? x + i : x + (i % 2 === 0 ? 2 : w - 6);
          const iy = horiz ? (i % 2 === 0 ? y + 2 : y + h - 6) : y + i;
          ctx.fillRect(ix, iy, 4, 4);
        }
      } else if (selectedMap === 'fungle') {
        // Dirt path with grass edges
        ctx.fillStyle = 'rgba(80,50,20,0.06)';
        ctx.fillRect(x + (horiz ? 0 : thick * 0.2), y + (horiz ? thick * 0.2 : 0),
                     horiz ? w : thick * 0.6, horiz ? thick * 0.6 : h);
        // Grass tufts along edges
        ctx.fillStyle = 'rgba(50,130,30,0.1)';
        if (horiz) {
          for (let gx = 8; gx < w; gx += 20) {
            // Top grass
            ctx.beginPath();
            ctx.moveTo(x + gx, y + 3); ctx.lineTo(x + gx + 3, y - 3); ctx.lineTo(x + gx + 6, y + 3);
            ctx.fill();
            // Bottom grass
            ctx.beginPath();
            ctx.moveTo(x + gx + 10, y + h - 3); ctx.lineTo(x + gx + 13, y + h + 3); ctx.lineTo(x + gx + 16, y + h - 3);
            ctx.fill();
          }
        } else {
          for (let gy = 8; gy < h; gy += 20) {
            ctx.beginPath();
            ctx.moveTo(x + 3, y + gy); ctx.lineTo(x - 3, y + gy + 3); ctx.lineTo(x + 3, y + gy + 6);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + w - 3, y + gy + 10); ctx.lineTo(x + w + 3, y + gy + 13); ctx.lineTo(x + w - 3, y + gy + 16);
            ctx.fill();
          }
        }
        // Scattered pebbles
        ctx.fillStyle = 'rgba(120,100,70,0.08)';
        for (let p = 0; p < Math.floor(len / 40); p++) {
          const px = horiz ? x + 15 + p * 40 + (p * 17 % 20) : x + thick * 0.3 + (p * 13 % (thick * 0.4));
          const py = horiz ? y + thick * 0.3 + (p * 19 % (thick * 0.4)) : y + 15 + p * 40 + (p * 17 % 20);
          ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI * 2); ctx.fill();
        }
      } else if (selectedMap === 'mira') {
        // Glass floor effect - reflection lines
        ctx.strokeStyle = 'rgba(100,200,255,0.04)';
        ctx.lineWidth = 1;
        if (horiz) {
          for (let rx = 20; rx < w; rx += 40) {
            ctx.beginPath();
            ctx.moveTo(x + rx, y + 8);
            ctx.lineTo(x + rx + 15, y + h - 8);
            ctx.stroke();
          }
        } else {
          for (let ry = 20; ry < h; ry += 40) {
            ctx.beginPath();
            ctx.moveTo(x + 8, y + ry);
            ctx.lineTo(x + w - 8, y + ry + 15);
            ctx.stroke();
          }
        }
        // Holographic edge accent
        ctx.fillStyle = 'rgba(100,200,255,0.03)';
        if (horiz) {
          ctx.fillRect(x, y + h / 2 - 1, w, 2);
        } else {
          ctx.fillRect(x + w / 2 - 1, y, 2, h);
        }
      } else if (selectedMap === 'airship') {
        // Wooden plank / carpet runner
        ctx.fillStyle = 'rgba(160,100,40,0.05)';
        const runnerInset = Math.max(thick * 0.2, 8);
        if (horiz) {
          ctx.fillRect(x, y + runnerInset, w, h - runnerInset * 2);
          // Plank lines
          ctx.strokeStyle = 'rgba(120,80,30,0.04)';
          ctx.lineWidth = 1;
          for (let px = 25; px < w; px += 50) {
            ctx.beginPath(); ctx.moveTo(x + px, y + runnerInset); ctx.lineTo(x + px, y + h - runnerInset); ctx.stroke();
          }
        } else {
          ctx.fillRect(x + runnerInset, y, w - runnerInset * 2, h);
          ctx.strokeStyle = 'rgba(120,80,30,0.04)';
          ctx.lineWidth = 1;
          for (let py = 25; py < h; py += 50) {
            ctx.beginPath(); ctx.moveTo(x + runnerInset, y + py); ctx.lineTo(x + w - runnerInset, y + py); ctx.stroke();
          }
        }
        // Screw heads at plank joints
        ctx.fillStyle = 'rgba(180,140,60,0.05)';
        if (horiz) {
          for (let px = 25; px < w; px += 50) {
            ctx.beginPath(); ctx.arc(x + px, y + runnerInset + 4, 1.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + px, y + h - runnerInset - 4, 1.5, 0, Math.PI * 2); ctx.fill();
          }
        } else {
          for (let py = 25; py < h; py += 50) {
            ctx.beginPath(); ctx.arc(x + runnerInset + 4, y + py, 1.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + w - runnerInset - 4, y + py, 1.5, 0, Math.PI * 2); ctx.fill();
          }
        }
      } else {
        // Skeld default - metal grating with hazard markings
        // Grating holes pattern
        ctx.fillStyle = 'rgba(0,0,0,0.04)';
        if (horiz) {
          for (let gx = 10; gx < w; gx += 16) {
            for (let gy = 10; gy < h; gy += 16) {
              ctx.fillRect(x + gx, y + gy, 3, 3);
            }
          }
        } else {
          for (let gx = 10; gx < w; gx += 16) {
            for (let gy = 10; gy < h; gy += 16) {
              ctx.fillRect(x + gx, y + gy, 3, 3);
            }
          }
        }
        // Hazard stripe at junctions (long hallways)
        if (len > 150) {
          ctx.fillStyle = 'rgba(255,200,0,0.04)';
          if (horiz) {
            for (let sx = 0; sx < 12; sx += 6) {
              ctx.beginPath();
              ctx.moveTo(x + sx, y); ctx.lineTo(x + sx + 10, y);
              ctx.lineTo(x + sx + 4, y + h); ctx.lineTo(x + sx - 6, y + h);
              ctx.closePath(); ctx.fill();
            }
            for (let sx = 0; sx < 12; sx += 6) {
              ctx.beginPath();
              ctx.moveTo(x + w - sx, y); ctx.lineTo(x + w - sx - 10, y);
              ctx.lineTo(x + w - sx - 4, y + h); ctx.lineTo(x + w - sx + 6, y + h);
              ctx.closePath(); ctx.fill();
            }
          } else {
            for (let sy = 0; sy < 12; sy += 6) {
              ctx.beginPath();
              ctx.moveTo(x, y + sy); ctx.lineTo(x, y + sy + 10);
              ctx.lineTo(x + w, y + sy + 4); ctx.lineTo(x + w, y + sy - 6);
              ctx.closePath(); ctx.fill();
            }
            for (let sy = 0; sy < 12; sy += 6) {
              ctx.beginPath();
              ctx.moveTo(x, y + h - sy); ctx.lineTo(x, y + h - sy - 10);
              ctx.lineTo(x + w, y + h - sy - 4); ctx.lineTo(x + w, y + h - sy + 6);
              ctx.closePath(); ctx.fill();
            }
          }
        }
      }

      // === AMBIENT OVERHEAD LIGHT POOLS ===
      if (len >= 120 && thick >= 50) {
        const lightSpacing = 120;
        const lightR = thick * 0.4;
        if (horiz) {
          for (let lx = 50; lx < w; lx += lightSpacing) {
            const grad = ctx.createRadialGradient(x + lx, y + h / 2, 0, x + lx, y + h / 2, lightR);
            grad.addColorStop(0, 'rgba(255,255,240,0.04)');
            grad.addColorStop(1, 'rgba(255,255,240,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(x + lx - lightR, y, lightR * 2, h);
          }
        } else {
          for (let ly = 50; ly < h; ly += lightSpacing) {
            const grad = ctx.createRadialGradient(x + w / 2, y + ly, 0, x + w / 2, y + ly, lightR);
            grad.addColorStop(0, 'rgba(255,255,240,0.04)');
            grad.addColorStop(1, 'rgba(255,255,240,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(x, y + ly - lightR, w, lightR * 2);
          }
        }
      }
    }

    function draw3DWall(x, y, w, h) {
      ctx.fillStyle = mapTheme.wall;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(x, y, w, 2);
      ctx.fillRect(x, y, 2, h);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(x, y + h - 2, w, 2);
      ctx.fillRect(x + w - 2, y, 2, h);
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      if (w > h) {
        for (let px = 50; px < w; px += 60) ctx.fillRect(x + px, y, 1, h);
      } else {
        for (let py = 50; py < h; py += 60) ctx.fillRect(x, y + py, w, 1);
      }
    }

    function drawRoomDecor(name, x, y, w, h) {
      ctx.save();
      ctx.globalAlpha = 0.25;
      const cx = x + w / 2, cy = y + h / 2;
      switch (name) {
        case 'Cafeteria': {
          // Diamond tile floor pattern (beige)
          ctx.strokeStyle = 'rgba(200,180,140,0.08)'; ctx.lineWidth = 0.5;
          for (let tx = 0; tx < w; tx += 30) {
            for (let ty = 0; ty < h; ty += 30) {
              ctx.save(); ctx.translate(x+tx+15, y+ty+15); ctx.rotate(Math.PI/4);
              ctx.strokeRect(-12, -12, 24, 24); ctx.restore();
            }
          }
          // 5 large round BLUE tables with center console panels
          const tbl = [[0.15,0.38],[0.42,0.22],[0.7,0.38],[0.28,0.68],[0.58,0.68]];
          for (const [tx,ty] of tbl) {
            const tbx = x+w*tx, tby = y+h*ty, tr = Math.min(w,h)*0.075;
            // Table shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.arc(tbx+2, tby+3, tr+1, 0, Math.PI*2); ctx.fill();
            // Blue table surface
            ctx.fillStyle = '#2a4a6a';
            ctx.beginPath(); ctx.arc(tbx, tby, tr, 0, Math.PI*2); ctx.fill();
            // Table rim
            ctx.strokeStyle = '#3a6a9a'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(tbx, tby, tr, 0, Math.PI*2); ctx.stroke();
            // Center console/panel on each table
            ctx.fillStyle = '#1a3a5a';
            ctx.beginPath(); ctx.arc(tbx, tby, tr*0.3, 0, Math.PI*2); ctx.fill();
            // Small light on center panel
            ctx.fillStyle = 'rgba(100,200,255,0.3)';
            ctx.beginPath(); ctx.arc(tbx, tby, 2, 0, Math.PI*2); ctx.fill();
            // 6 chairs around table (small squares)
            ctx.fillStyle = '#3a4a5a';
            for (let a = 0; a < 6; a++) {
              const ang = a*Math.PI/3, cr = tr + 12;
              ctx.fillRect(tbx+Math.cos(ang)*cr-4, tby+Math.sin(ang)*cr-4, 8, 8);
            }
          }
          // Emergency button pedestal (center, slightly larger table area)
          ctx.fillStyle = '#3a2525';
          ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = '#5a3535'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI*2); ctx.stroke();
          break;
        }
        case 'Electrical': {
          // Dark industrial room - messy wiring everywhere
          // Yellow hazard cables running across the floor
          const wireColors = ['#dd8822','#cc3333','#33cc33','#3388dd','#cccc22'];
          for (let i = 0; i < 8; i++) {
            ctx.strokeStyle = wireColors[i % wireColors.length]; ctx.lineWidth = 1.8;
            const yy = y + h*0.08 + i*h*0.11;
            ctx.beginPath(); ctx.moveTo(x+5, yy);
            ctx.bezierCurveTo(x+w*0.2, yy+10*(i%2?1:-1), x+w*0.4, yy-8*(i%3?1:-1), x+w*0.55, yy+h*0.04);
            ctx.bezierCurveTo(x+w*0.65, yy+h*0.06, x+w*0.7, yy-4, x+w*0.68, yy+h*0.02);
            ctx.stroke();
          }
          // Yellow hazard tape on floor
          ctx.fillStyle = 'rgba(200,180,0,0.06)';
          ctx.fillRect(x+w*0.3, y, w*0.05, h);
          ctx.fillRect(x, y+h*0.5, w, h*0.04);
          // Large electrical panel on right wall (Fix Lights breaker box)
          ctx.fillStyle = '#333'; ctx.fillRect(x+w*0.68, y+8, w*0.28, h-16);
          ctx.strokeStyle = '#4a4a4a'; ctx.lineWidth = 1.5;
          ctx.strokeRect(x+w*0.68, y+8, w*0.28, h-16);
          // Rows of switches/breakers on the panel
          for (let r = 0; r < 6; r++) {
            for (let c = 0; c < 2; c++) {
              const sx = x+w*0.72+c*w*0.12, sy = y+18+r*(h-40)/6;
              ctx.fillStyle = r%2===0 ? '#5a5a5a' : '#4a4a4a';
              ctx.fillRect(sx, sy, w*0.08, (h-40)/7);
              // Switch toggle
              ctx.fillStyle = r%3===0 ? '#44aa44' : '#aa4444';
              ctx.fillRect(sx+w*0.025, sy+2, w*0.03, 6);
            }
          }
          // Left equipment racks
          ctx.fillStyle = '#2a2a2a'; ctx.fillRect(x+5, y+h*0.1, w*0.15, h*0.35);
          ctx.fillRect(x+5, y+h*0.55, w*0.15, h*0.35);
          // Rack panel details
          ctx.fillStyle = '#3a3a3a';
          for (let r = 0; r < 3; r++) {
            ctx.fillRect(x+8, y+h*0.14+r*h*0.1, w*0.12, h*0.06);
            ctx.fillRect(x+8, y+h*0.58+r*h*0.1, w*0.12, h*0.06);
          }
          // Warning sign
          ctx.fillStyle = 'rgba(200,200,0,0.15)';
          ctx.fillRect(x+w*0.38, y+5, 30, 15);
          ctx.fillStyle = 'rgba(0,0,0,0.15)';
          ctx.font = '8px Arial'; ctx.textAlign = 'center';
          ctx.fillText('⚡', x+w*0.38+15, y+15);
          break;
        }
        case 'MedBay': {
          // Sterile blue/white color palette room
          // Medical scanner platform in center (circular device)
          ctx.strokeStyle = '#44bbcc'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI*2); ctx.stroke();
          // Scanner inner ring
          ctx.strokeStyle = '#66ddee'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI*2); ctx.stroke();
          // Scanner platform fill
          ctx.fillStyle = 'rgba(68,187,204,0.12)';
          ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI*2); ctx.fill();
          // Scanning beam effect (vertical line)
          ctx.fillStyle = 'rgba(100,255,255,0.15)';
          ctx.fillRect(cx-1.5, cy-28, 3, 56);
          // Two hospital beds with blue sheets (along top wall)
          for (let b = 0; b < 2; b++) {
            const bx = x + w*0.15 + b*w*0.45, by = y + 12;
            // Bed frame
            ctx.fillStyle = '#e0e8f0'; ctx.globalAlpha = 0.3;
            ctx.fillRect(bx, by, w*0.28, h*0.22);
            ctx.globalAlpha = 0.25;
            // Blue sheet/mattress
            ctx.fillStyle = '#4a7aaa';
            ctx.fillRect(bx+3, by+3, w*0.28-6, h*0.22-6);
            // Pillow
            ctx.fillStyle = '#8ab0d0';
            ctx.fillRect(bx+3, by+3, w*0.06, h*0.22-6);
          }
          // Wall cabinets (bottom wall)
          ctx.fillStyle = '#3a5a6a';
          ctx.fillRect(x+10, y+h-25, w*0.3, 15);
          ctx.fillRect(x+w*0.4, y+h-25, w*0.3, 15);
          // Cabinet doors
          ctx.strokeStyle = '#4a6a7a'; ctx.lineWidth = 0.5;
          ctx.strokeRect(x+10, y+h-25, w*0.15, 15);
          ctx.strokeRect(x+10+w*0.15, y+h-25, w*0.15, 15);
          // Medical equipment on side
          ctx.fillStyle = '#5a7a8a';
          ctx.fillRect(x+w-25, y+h*0.3, 15, 40);
          // IV stand
          ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(x+w-18, y+h*0.3); ctx.lineTo(x+w-18, y+h*0.15); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x+w-24, y+h*0.15); ctx.lineTo(x+w-12, y+h*0.15); ctx.stroke();
          break;
        }
        case 'Reactor': {
          const rr = Math.min(w,h)*0.16;
          // Purple ambient glow for the whole room
          const purpleAmb = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w,h)*0.5);
          purpleAmb.addColorStop(0, 'rgba(120,40,180,0.12)');
          purpleAmb.addColorStop(1, 'rgba(80,20,120,0)');
          ctx.fillStyle = purpleAmb;
          ctx.fillRect(x, y, w, h);
          // Large cylindrical reactor core - outer containment ring
          ctx.strokeStyle = '#6a4aaa'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI*2); ctx.stroke();
          // Inner energy ring
          ctx.strokeStyle = '#5ae0ff'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(cx, cy, rr*0.55, 0, Math.PI*2); ctx.stroke();
          // Core center - bright cyan/blue glow
          const coreGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr*0.5);
          coreGlow.addColorStop(0, 'rgba(90,224,255,0.4)');
          coreGlow.addColorStop(0.5, 'rgba(90,180,255,0.15)');
          coreGlow.addColorStop(1, 'rgba(80,40,180,0)');
          ctx.fillStyle = coreGlow;
          ctx.beginPath(); ctx.arc(cx, cy, rr*0.5, 0, Math.PI*2); ctx.fill();
          // Bright core center dot
          ctx.fillStyle = 'rgba(200,240,255,0.5)';
          ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2); ctx.fill();
          // Tall vertical plasma rods/energy tubes connecting to hull
          ctx.strokeStyle = '#5ae0ff'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(cx, cy-rr); ctx.lineTo(cx, y+8); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx, cy+rr); ctx.lineTo(cx, y+h-8); ctx.stroke();
          // Side plasma conduits
          ctx.strokeStyle = 'rgba(90,180,255,0.3)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(cx-rr, cy); ctx.lineTo(x+8, cy); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx+rr, cy); ctx.lineTo(x+w-8, cy); ctx.stroke();
          // Metallic cables from core to corners
          ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(cx-rr*0.7, cy-rr*0.7); ctx.lineTo(x+20, y+20); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx+rr*0.7, cy-rr*0.7); ctx.lineTo(x+w-20, y+20); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx-rr*0.7, cy+rr*0.7); ctx.lineTo(x+20, y+h-20); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx+rr*0.7, cy+rr*0.7); ctx.lineTo(x+w-20, y+h-20); ctx.stroke();
          // Metallic support pillars at corners
          ctx.fillStyle = '#4a4a5a';
          ctx.fillRect(x+12, y+12, 20, 20);
          ctx.fillRect(x+w-32, y+12, 20, 20);
          ctx.fillRect(x+12, y+h-32, 20, 20);
          ctx.fillRect(x+w-32, y+h-32, 20, 20);
          // Hand reader panels for meltdown fix (left and right walls)
          ctx.fillStyle = '#2a2a4a';
          ctx.fillRect(x+8, cy-18, 28, 36);
          ctx.fillRect(x+w-36, cy-18, 28, 36);
          // Hand print outlines
          ctx.strokeStyle = '#6a6aaa'; ctx.lineWidth = 1;
          ctx.strokeRect(x+12, cy-14, 20, 28);
          ctx.strokeRect(x+w-32, cy-14, 20, 28);
          // Small indicator lights on readers
          ctx.fillStyle = 'rgba(90,224,255,0.4)';
          ctx.beginPath(); ctx.arc(x+22, cy-18, 3, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(x+w-22, cy-18, 3, 0, Math.PI*2); ctx.fill();
          break;
        }
        case 'Navigation': {
          // Cockpit/helm area - large viewing window showing space
          ctx.fillStyle = '#050818';
          ctx.fillRect(x+w*0.55, y+8, w*0.42, h-16);
          ctx.strokeStyle = '#2a2a45'; ctx.lineWidth = 2;
          ctx.strokeRect(x+w*0.55, y+8, w*0.42, h-16);
          // Window frame dividers
          ctx.strokeStyle = '#3a3a50'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(x+w*0.7, y+8); ctx.lineTo(x+w*0.7, y+h-8); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x+w*0.85, y+8); ctx.lineTo(x+w*0.85, y+h-8); ctx.stroke();
          // Stars visible through window
          ctx.fillStyle = 'rgba(255,255,255,0.35)';
          for (let s = 0; s < 15; s++) {
            const sx = x+w*0.58+(s*71)%(w*0.37), sy = y+12+(s*43)%(h-28);
            const sz = s%3===0 ? 2 : 1;
            ctx.fillRect(sx, sy, sz, sz);

          ctx.fillStyle = '#4a3020'; ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#ff6620'; ctx.globalAlpha = 0.4;
          ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#ffaa30'; ctx.beginPath(); ctx.arc(cx, cy-4, 6, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 0.25; ctx.fillStyle = '#3a2a15';
          ctx.fillRect(cx-35, cy-8, 14, 6); ctx.fillRect(cx+22, cy-8, 14, 6);
          ctx.fillRect(cx-6, cy+26, 14, 6); ctx.fillRect(cx-6, cy-32, 14, 6);
          break;
        }
        case 'Splash Zone': {
          ctx.strokeStyle = '#3388cc'; ctx.lineWidth = 2;
          for (let wy = 0; wy < 4; wy++) {
            ctx.beginPath();
            for (let wx = 0; wx < w; wx += 5) {
              const yy = y + h*0.3 + wy*h*0.15 + Math.sin(wx*0.1)*8;
              wx === 0 ? ctx.moveTo(x+wx, yy) : ctx.lineTo(x+wx, yy);
            }
            ctx.stroke();
          }
          break;
        }
        case 'Mining Pit': {
          ctx.fillStyle = '#4a4040';
          ctx.beginPath(); ctx.arc(x+w*0.2, y+h*0.3, 15, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(x+w*0.7, y+h*0.6, 18, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(x+w*0.4, y+h*0.7, 12, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#44aaff'; ctx.globalAlpha = 0.4; ctx.fillRect(x+w*0.22, y+h*0.28, 6, 6);
          ctx.fillStyle = '#ff44aa'; ctx.fillRect(x+w*0.68, y+h*0.58, 6, 6);
          break;
        }
        case 'Upper Engine': case 'Lower Engine': case 'Engine Room': {
          const er = Math.min(w,h)*0.25;
          // Large circular thruster housing (protruding from left wall)
          // Outer thruster ring - gray metallic
          ctx.fillStyle = '#4a4a50';
          ctx.beginPath(); ctx.arc(x + w*0.3, cy, er, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = '#5a5a60'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(x + w*0.3, cy, er, 0, Math.PI*2); ctx.stroke();
          // Inner thruster ring
          ctx.strokeStyle = '#3a3a44'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(x + w*0.3, cy, er*0.7, 0, Math.PI*2); ctx.stroke();
          // Engine core - light blue plasma glow
          const engGlow = ctx.createRadialGradient(x+w*0.3, cy, 0, x+w*0.3, cy, er*0.6);
          engGlow.addColorStop(0, 'rgba(120,180,255,0.4)');
          engGlow.addColorStop(0.6, 'rgba(80,140,255,0.15)');
          engGlow.addColorStop(1, 'rgba(40,80,200,0)');
          ctx.fillStyle = engGlow;
          ctx.beginPath(); ctx.arc(x+w*0.3, cy, er*0.6, 0, Math.PI*2); ctx.fill();
          // Bright center
          ctx.fillStyle = 'rgba(180,220,255,0.5)';
          ctx.beginPath(); ctx.arc(x+w*0.3, cy, 4, 0, Math.PI*2); ctx.fill();
          // Orange/gray mechanical components around engine
          ctx.fillStyle = '#8a5a2a';
          ctx.fillRect(x+w*0.3+er-5, cy-er*0.4, 10, er*0.3); // right support
          ctx.fillRect(x+w*0.3+er-5, cy+er*0.1, 10, er*0.3); // right support lower
          ctx.fillStyle = '#6a4a1a';
          ctx.fillRect(x+w*0.3-er-5, cy-er*0.3, 10, er*0.6); // left support bracket
          // Pipes and machinery (right side of room)
          ctx.fillStyle = '#3a3a40';
          ctx.fillRect(x+w*0.6, y+15, w*0.12, h-30); // vertical pipe
          ctx.fillRect(x+w*0.75, y+15, w*0.08, h*0.3); // upper machinery
          ctx.fillRect(x+w*0.75, y+h*0.6, w*0.08, h*0.3); // lower machinery
          // Metallic platform railing
          ctx.strokeStyle = '#5a5a60'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(x+w*0.55, y+10); ctx.lineTo(x+w*0.55, y+h-10); ctx.stroke();
          // Control console
          ctx.fillStyle = '#2a3a2a';
          ctx.fillRect(x+w*0.8, cy-15, 25, 30);
          ctx.fillStyle = 'rgba(100,200,100,0.3)';
          ctx.fillRect(x+w*0.82, cy-10, 18, 8); // screen
          // Fuel intake at bottom
          ctx.fillStyle = '#4a3a2a';
          ctx.fillRect(x+w*0.4, y+h-16, 30, 16);
          break;
        }
        case 'Cockpit': {
          ctx.fillStyle = '#0a1525'; ctx.fillRect(x+10, y+h*0.15, w*0.35, h*0.6);
          ctx.strokeStyle = '#334455'; ctx.lineWidth = 1; ctx.strokeRect(x+10, y+h*0.15, w*0.35, h*0.6);
          ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.4;
          for (const [sx,sy] of [[0.08,0.25],[0.15,0.5],[0.25,0.35],[0.1,0.65],[0.2,0.2]])
            ctx.fillRect(x+w*sx, y+h*sy, 2, 2);
          ctx.globalAlpha = 0.25; ctx.strokeStyle = '#666'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(x+w*0.7, cy, 20, 0, Math.PI*2); ctx.stroke();
          break;
        }
        case 'Locker Room': {
          ctx.fillStyle = '#3a3a4a';
          for (let i = 0; i < 4; i++) ctx.fillRect(x+15+i*25, y+15, 20, h*0.35);
          break;
        }
        case 'Boiler Room': {
          ctx.fillStyle = '#444';
          ctx.beginPath(); ctx.arc(cx-25, cy, 22, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(cx+25, cy, 22, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(cx-25, cy, 22, 0, Math.PI*2); ctx.stroke();
          ctx.beginPath(); ctx.arc(cx+25, cy, 22, 0, Math.PI*2); ctx.stroke();
          break;
        }
        case 'Dock': {
          ctx.fillStyle = '#3a3020';
          for (let i = 0; i < 5; i++) ctx.fillRect(x+10, y+15+i*h*0.18, w-20, 8);
          break;
        }
        case 'Showers': {
          ctx.strokeStyle = '#556'; ctx.lineWidth = 1;
          for (let i = 0; i < 3; i++) ctx.strokeRect(x+w*0.15+i*w*0.25, y+h*0.2, w*0.2, h*0.5);
          ctx.fillStyle = '#4488cc'; ctx.globalAlpha = 0.3;
          for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x+w*0.25+i*w*0.25, y+h*0.35, 3, 0, Math.PI*2); ctx.fill(); }
          break;
        }
        case 'Records': {
          ctx.fillStyle = '#3a3020';
          ctx.fillRect(x+w*0.1, y+h*0.2, w*0.2, h*0.6); ctx.fillRect(x+w*0.65, y+h*0.2, w*0.2, h*0.6);
          ctx.strokeStyle = '#4a4030'; ctx.lineWidth = 1;
          for (let d = 0; d < 3; d++) {
            ctx.strokeRect(x+w*0.12, y+h*0.25+d*h*0.17, w*0.16, h*0.12);
            ctx.strokeRect(x+w*0.67, y+h*0.25+d*h*0.17, w*0.16, h*0.12);
          }
          break;
        }
        case 'Gap Room': {
          ctx.fillStyle = '#1a1510'; ctx.fillRect(cx-20, y+h*0.3, 40, h*0.4);
          ctx.strokeStyle = '#4a4030'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(cx-15, y+h*0.35); ctx.lineTo(cx-15, y+h*0.65); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx+15, y+h*0.35); ctx.lineTo(cx+15, y+h*0.65); ctx.stroke();
          for (let r = 0; r < 4; r++) { ctx.beginPath(); ctx.moveTo(cx-15, y+h*0.38+r*h*0.07); ctx.lineTo(cx+15, y+h*0.38+r*h*0.07); ctx.stroke(); }
          break;
        }
        case 'Main Hall': {
          ctx.fillStyle = '#3a1818'; ctx.fillRect(cx-w*0.3, cy-h*0.25, w*0.6, h*0.5);
          ctx.strokeStyle = '#5a2828'; ctx.lineWidth = 1; ctx.strokeRect(cx-w*0.28, cy-h*0.23, w*0.56, h*0.46);
          break;
        }
        case 'Viewing Deck': {
          ctx.fillStyle = '#0a1525';
          ctx.fillRect(x+w*0.1, y+10, w*0.35, h*0.3); ctx.fillRect(x+w*0.55, y+10, w*0.35, h*0.3);
          ctx.strokeStyle = '#334455'; ctx.lineWidth = 1;
          ctx.strokeRect(x+w*0.1, y+10, w*0.35, h*0.3); ctx.strokeRect(x+w*0.55, y+10, w*0.35, h*0.3);
          break;
        }
        case 'Meeting Room': {
          ctx.fillStyle = '#3a3020'; ctx.fillRect(cx-50, cy-20, 100, 40);
          ctx.strokeStyle = '#5a5040'; ctx.lineWidth = 1; ctx.strokeRect(cx-50, cy-20, 100, 40);
          break;
        }
        case 'Cargo Bay': {
          ctx.fillStyle = '#3a3020';
          ctx.fillRect(x+w*0.1, y+h*0.15, 40, 30); ctx.fillRect(x+w*0.1, y+h*0.55, 35, 35);
          ctx.fillRect(x+w*0.55, y+h*0.2, 45, 30); ctx.fillRect(x+w*0.6, y+h*0.6, 40, 30);
          ctx.fillRect(x+w*0.3, y+h*0.4, 35, 25);
          break;
        }
        case 'Balcony': {
          ctx.strokeStyle = '#556'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(x+10, y+h-20); ctx.lineTo(x+w-10, y+h-20); ctx.stroke();
          for (let p = 0; p < 5; p++) { ctx.beginPath(); ctx.moveTo(x+20+p*(w-40)/4, y+h-20); ctx.lineTo(x+20+p*(w-40)/4, y+h-8); ctx.stroke(); }
          break;
        }
        case 'Launchpad': {
          ctx.strokeStyle = '#666'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(cx, cy, Math.min(w,h)*0.25, 0, Math.PI*2); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx-20, cy); ctx.lineTo(cx+20, cy); ctx.moveTo(cx, cy-20); ctx.lineTo(cx, cy+20); ctx.stroke();
          break;
        }
        case 'Dropship': {
          ctx.strokeStyle = '#556'; ctx.lineWidth = 2; ctx.beginPath();
          ctx.moveTo(cx, y+15); ctx.lineTo(cx+30, cy); ctx.lineTo(cx+20, y+h-15);
          ctx.lineTo(cx-20, y+h-15); ctx.lineTo(cx-30, cy); ctx.closePath(); ctx.stroke();
          break;
        }
        case 'Decontamination': {
          ctx.strokeStyle = '#4488aa'; ctx.lineWidth = 1;
          for (let s = 0; s < 3; s++) { ctx.beginPath(); ctx.arc(cx, cy, 10+s*10, 0, Math.PI*2); ctx.stroke(); }
          break;
        }
        case 'Lookout': {
          ctx.fillStyle = '#0a2010'; ctx.fillRect(x+w*0.6, y+10, w*0.35, h*0.5);
          ctx.strokeStyle = '#2a4a2a'; ctx.lineWidth = 1; ctx.strokeRect(x+w*0.6, y+10, w*0.35, h*0.5);
          // Telescope
          ctx.strokeStyle = '#666'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(x+w*0.3, cy+20); ctx.lineTo(x+w*0.3, cy-30); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x+w*0.22, cy-30); ctx.lineTo(x+w*0.38, cy-30); ctx.stroke();
          break;
        }
      }
      ctx.restore();
    }

    function drawEnvironmentBG(ox, oy) {
      if (selectedMap === 'skeld' || selectedMap === 'airship') {
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        for (let i = 0; i < 80; i++) {
          const sx = (i * 347 + 123) % MAP_W, sy = (i * 271 + 456) % MAP_H;
          const sz = (i % 3 === 0) ? 2 : 1;
          ctx.fillRect(sx - ox, sy - oy, sz, sz);
        }
      } else if (selectedMap === 'mira') {
        // Cloud wisps
        ctx.fillStyle = 'rgba(150,200,255,0.03)';
        for (let i = 0; i < 15; i++) {
          const sx = (i * 431 + 89) % MAP_W, sy = (i * 283 + 167) % MAP_H;
          ctx.beginPath(); ctx.ellipse(sx - ox, sy - oy, 60, 20, 0, 0, Math.PI*2); ctx.fill();
        }
      } else if (selectedMap === 'polus') {
        ctx.fillStyle = 'rgba(200,220,255,0.05)';
        for (let i = 0; i < 50; i++) {
          const sx = (i * 397 + 213) % MAP_W, sy = (i * 311 + 156) % MAP_H;
          ctx.beginPath(); ctx.arc(sx - ox, sy - oy, 2 + (i % 3), 0, Math.PI*2); ctx.fill();
        }
      } else if (selectedMap === 'fungle') {
        ctx.fillStyle = 'rgba(60,120,40,0.06)';
        for (let i = 0; i < 35; i++) {
          const sx = (i * 431 + 189) % MAP_W, sy = (i * 283 + 567) % MAP_H;
          ctx.beginPath(); ctx.arc(sx - ox, sy - oy, 6, Math.PI, 0); ctx.fill();
          ctx.fillRect(sx - ox - 2, sy - oy, 4, 8);
        }
        // Vines hanging
        ctx.strokeStyle = 'rgba(40,100,30,0.08)'; ctx.lineWidth = 2;
        for (let i = 0; i < 20; i++) {
          const sx = (i * 523 + 67) % MAP_W, sy = (i * 179 + 333) % MAP_H;
          ctx.beginPath(); ctx.moveTo(sx-ox, sy-oy); ctx.quadraticCurveTo(sx-ox+10, sy-oy+20, sx-ox-5, sy-oy+40); ctx.stroke();
        }
      }
    }

    function drawMap(ox, oy) {
      // Background
      ctx.fillStyle = mapTheme.bg;
      ctx.fillRect(-ox, -oy, MAP_W, MAP_H);

      // Environment background (stars, snow, mushrooms, clouds)
      drawEnvironmentBG(ox, oy);

      // Room floors with per-room colors and textures
      if (mapTheme.floors) {
        const numRooms = rooms.length;
        for (let i = 0; i < mapTheme.floors.length; i++) {
          const f = mapTheme.floors[i];
          const fx = f.x - ox, fy = f.y - oy;
          if (i < numRooms) {
            // Room floor with unique color
            ctx.fillStyle = roomFloorColors[rooms[i].name] || '#222228';
            ctx.fillRect(fx, fy, f.w, f.h);
            drawFloorTiles(fx, fy, f.w, f.h);
            // Room border glow
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 1;
            ctx.strokeRect(fx + 2, fy + 2, f.w - 4, f.h - 4);
            // Room decorations
            drawRoomDecor(rooms[i].name, fx, fy, f.w, f.h);
          } else {
            // Hallway
            ctx.fillStyle = selectedMap === 'polus' ? 'rgba(120,130,160,0.06)' :
                            selectedMap === 'fungle' ? 'rgba(80,120,60,0.06)' :
                            selectedMap === 'mira' ? 'rgba(100,180,255,0.04)' :
                            'rgba(150,150,180,0.06)';
            ctx.fillRect(fx, fy, f.w, f.h);
            drawHallwayDetail(fx, fy, f.w, f.h);
          }
        }
      }

      // 3D Walls with panel detail
      for (const w of walls) {
        draw3DWall(w.x - ox, w.y - oy, w.w, w.h);
      }

      // Doors
      for (const d of doors) {
        const dx = d.x - ox, dy = d.y - oy;
        if (d.closed) {
          // Closed door - solid barrier with warning color
          ctx.fillStyle = '#8a2020';
          ctx.fillRect(dx, dy, d.w, d.h);
          // Metallic highlights
          ctx.fillStyle = 'rgba(255,100,100,0.15)';
          ctx.fillRect(dx, dy, d.w, 2);
          ctx.fillRect(dx, dy, 2, d.h);
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.fillRect(dx, dy + d.h - 2, d.w, 2);
          ctx.fillRect(dx + d.w - 2, dy, 2, d.h);
          // Hazard stripes
          ctx.strokeStyle = 'rgba(255,200,0,0.3)';
          ctx.lineWidth = 2;
          if (d.dir === 'h') {
            for (let s = 0; s < d.w; s += 12) {
              ctx.beginPath(); ctx.moveTo(dx + s, dy); ctx.lineTo(dx + s + 6, dy + d.h); ctx.stroke();
            }
          } else {
            for (let s = 0; s < d.h; s += 12) {
              ctx.beginPath(); ctx.moveTo(dx, dy + s); ctx.lineTo(dx + d.w, dy + s + 6); ctx.stroke();
            }
          }
          // Timer bar
          const pct = d.timer / DOOR_CLOSE_DURATION;
          ctx.fillStyle = 'rgba(255,80,80,0.6)';
          if (d.dir === 'h') {
            ctx.fillRect(dx, dy + d.h + 2, d.w * pct, 3);
          } else {
            ctx.fillRect(dx + d.w + 2, dy, 3, d.h * pct);
          }
        } else {
          // Open door - subtle frame showing where door is
          ctx.fillStyle = 'rgba(100,255,100,0.06)';
          ctx.fillRect(dx, dy, d.w, d.h);
          ctx.strokeStyle = 'rgba(100,255,100,0.1)';
          ctx.lineWidth = 1;
          ctx.strokeRect(dx, dy, d.w, d.h);
          // Door track lines
          if (d.dir === 'h') {
            ctx.fillStyle = 'rgba(255,255,255,0.04)';
            ctx.fillRect(dx, dy, d.w, 2);
            ctx.fillRect(dx, dy + d.h - 2, d.w, 2);
          } else {
            ctx.fillStyle = 'rgba(255,255,255,0.04)';
            ctx.fillRect(dx, dy, 2, d.h);
            ctx.fillRect(dx + d.w - 2, dy, 2, d.h);
          }
        }
      }

      // Room labels
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      for (const r of rooms) {
        // Text shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillText(r.name, r.x - ox + 1, r.y - oy + 1);
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.fillText(r.name, r.x - ox, r.y - oy);
      }

      // Vents (enhanced with shadow and depth)
      for (const v of vents) {
        const vx = v.x - ox - 20, vy = v.y - oy - 12;
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(vx + 3, vy + 3, 40, 24);
        ctx.fillStyle = '#3a3a3a';
        ctx.fillRect(vx, vy, 40, 24);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.strokeRect(vx, vy, 40, 24);
        ctx.fillStyle = '#2a2a2a';
        for (let s = 4; s < 36; s += 5) ctx.fillRect(vx + s, vy + 3, 2, 18);
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(vx + 1, vy + 1, 38, 2);
      }

      // CCTV Cameras (mounted on walls in hallways)
      for (const cam of cameras) {
        const cx = cam.x - ox, cy = cam.y - oy;
        // Camera mount bracket
        ctx.fillStyle = '#2a2a2a';
        ctx.fillRect(cx - 3, cy - 14, 6, 14);
        // Camera body
        ctx.fillStyle = '#3a3a3a';
        ctx.fillRect(cx - 10, cy - 8, 20, 12);
        // Lens
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath(); ctx.arc(cx + 8, cy - 2, 4, 0, Math.PI * 2); ctx.fill();
        // Status light (blinks red when not sabotaged)
        const blinkOn = !sabotage.active || sabotage.type !== 'comms';
        if (blinkOn && Math.floor(Date.now() / 800) % 2 === 0) {
          ctx.fillStyle = 'rgba(255,50,50,0.9)';
          ctx.beginPath(); ctx.arc(cx - 6, cy - 6, 2.5, 0, Math.PI * 2); ctx.fill();
          // Red glow
          ctx.fillStyle = 'rgba(255,50,50,0.15)';
          ctx.beginPath(); ctx.arc(cx - 6, cy - 6, 8, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(80,80,80,0.6)';
          ctx.beginPath(); ctx.arc(cx - 6, cy - 6, 2.5, 0, Math.PI * 2); ctx.fill();
        }
      }

      // Exterior ship features (rendered outside hull)
      if (exteriorFeatures) {
        ctx.save();
        // Thrusters (rear of ship - animated flame)
        if (exteriorFeatures.thrusters) {
          for (const t of exteriorFeatures.thrusters) {
            const tx = t.x - ox, ty = t.y - oy;
            // Thruster nozzle
            ctx.fillStyle = '#4a4a60';
            ctx.fillRect(tx - 5, ty - 8, 10, 16);
            // Flame (animated flicker)
            const flicker = Math.sin(Date.now() / 100 + t.y) * 8;
            const grad = ctx.createLinearGradient(tx - 30 - flicker, ty, tx, ty);
            grad.addColorStop(0, 'rgba(255,100,30,0)');
            grad.addColorStop(0.3, 'rgba(255,150,50,0.3)');
            grad.addColorStop(0.7, 'rgba(100,150,255,0.5)');
            grad.addColorStop(1, 'rgba(200,220,255,0.7)');
            ctx.fillStyle = grad;
            ctx.fillRect(tx - 35 - flicker, ty - 6, 35 + flicker, 12);
          }
        }
        // Cannons (top-right, near Weapons)
        if (exteriorFeatures.cannons) {
          for (const c of exteriorFeatures.cannons) {
            const cx = c.x - ox, cy = c.y - oy;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(c.angle || 0);
            // Cannon base
            ctx.fillStyle = '#5a3030';
            ctx.fillRect(-6, -4, 12, 8);
            // Cannon barrel
            ctx.fillStyle = '#cc3333';
            ctx.fillRect(10, -2, 20, 4);
            // Muzzle glow
            ctx.fillStyle = 'rgba(255,80,80,0.2)';
            ctx.beginPath(); ctx.arc(30, 0, 5, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }
        }
        // Shield domes (bottom-right, near Shields room)
        if (exteriorFeatures.shieldDomes) {
          for (const s of exteriorFeatures.shieldDomes) {
            const sx = s.x - ox, sy = s.y - oy;
            // Shield dome base
            ctx.fillStyle = 'rgba(60,60,180,0.4)';
            ctx.beginPath(); ctx.arc(sx, sy, 18, 0, Math.PI * 2); ctx.fill();
            // Inner energy ring
            ctx.strokeStyle = 'rgba(100,150,255,0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(sx, sy, 12, 0, Math.PI * 2); ctx.stroke();
            // Pulsing glow
            const pulse = Math.sin(Date.now() / 500 + s.x) * 0.15 + 0.25;
            ctx.fillStyle = `rgba(100,150,255,${pulse})`;
            ctx.beginPath(); ctx.arc(sx, sy, 8, 0, Math.PI * 2); ctx.fill();
          }
        }
        // Communication antennas (near Comms)
        if (exteriorFeatures.antennas) {
          for (const a of exteriorFeatures.antennas) {
            const ax = a.x - ox, ay = a.y - oy;
            // Antenna pole
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax, ay + 30); ctx.stroke();
            // Dish
            ctx.fillStyle = '#888';
            ctx.beginPath(); ctx.arc(ax, ay, 8, Math.PI * 0.8, Math.PI * 2.2); ctx.fill();
            // Signal waves
            const wave = Math.sin(Date.now() / 400 + a.x) * 0.3 + 0.2;
            ctx.strokeStyle = `rgba(150,200,255,${wave})`;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(ax, ay - 5, 14, -0.5, 0.5); ctx.stroke();
            ctx.beginPath(); ctx.arc(ax, ay - 5, 20, -0.4, 0.4); ctx.stroke();
          }
        }
        // Garbage disposal chute
        if (exteriorFeatures.garbageChute) {
          const gc = exteriorFeatures.garbageChute;
          const gx = gc.x - ox, gy = gc.y - oy;
          ctx.fillStyle = '#3a3a3a';
          ctx.fillRect(gx - 15, gy, 30, 16);
          ctx.fillStyle = '#2a2a2a';
          ctx.fillRect(gx - 10, gy + 16, 20, 8);
          // Hatch lines
          ctx.strokeStyle = '#555';
          ctx.lineWidth = 1;
          ctx.strokeRect(gx - 15, gy, 30, 16);
        }
        // Dropship bay
        if (exteriorFeatures.dropshipBay) {
          const db = exteriorFeatures.dropshipBay;
          const dx = db.x - ox, dy = db.y - oy;
          // Bay doors outline
          ctx.strokeStyle = 'rgba(150,150,180,0.3)';
          ctx.lineWidth = 2;
          ctx.strokeRect(dx - 40, dy, 80, 24);
          // Hatch seam line
          ctx.strokeStyle = 'rgba(200,200,220,0.2)';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(dx, dy); ctx.lineTo(dx, dy + 24); ctx.stroke();
        }
        ctx.restore();
      }

      // Emergency button (enhanced with platform and gradient)
      const ebx = EMERGENCY_BTN.x - ox, eby = EMERGENCY_BTN.y - oy;
      ctx.fillStyle = '#2a2a2a';
      ctx.beginPath(); ctx.arc(ebx, eby, EMERGENCY_BTN.radius + 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3a3a3a';
      ctx.beginPath(); ctx.arc(ebx, eby, EMERGENCY_BTN.radius + 4, 0, Math.PI * 2); ctx.fill();
      const btnGrad = ctx.createRadialGradient(ebx - 3, eby - 3, 2, ebx, eby, EMERGENCY_BTN.radius);
      if (emergencyCooldown <= 0) {
        btnGrad.addColorStop(0, '#ff6666'); btnGrad.addColorStop(1, '#cc2222');
      } else {
        btnGrad.addColorStop(0, '#884444'); btnGrad.addColorStop(1, '#552222');
      }
      ctx.fillStyle = btnGrad;
      ctx.beginPath(); ctx.arc(ebx, eby, EMERGENCY_BTN.radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ebx, eby, EMERGENCY_BTN.radius, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center';
      ctx.fillText('EMERGENCY', ebx, eby + 3);

      // Tasks (enhanced with glow)
      for (const t of taskLocations) {
        const tx = t.x - ox, ty = t.y - oy;
        if (t.done) {
          ctx.fillStyle = 'rgba(78,205,196,0.1)';
          ctx.beginPath(); ctx.arc(tx, ty, 20, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(78,205,196,0.2)';
          ctx.beginPath(); ctx.arc(tx, ty, 12, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#4ecdc4'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
          ctx.fillText('\u2713', tx, ty + 6);
        } else {
          ctx.fillStyle = isImpostor ? 'rgba(255,255,0,0.05)' : 'rgba(255,255,0,0.12)';
          ctx.beginPath(); ctx.arc(tx, ty, 24, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = isImpostor ? 'rgba(255,255,0,0.08)' : 'rgba(255,255,0,0.25)';
          ctx.beginPath(); ctx.arc(tx, ty, 15, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ffd700'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
          ctx.fillText('!', tx, ty + 6);
        }
      }
    }

    function drawMinimap() {
      const scale = minimapCanvas.width / MAP_W;
      minimapCtx.fillStyle = 'rgba(0,0,0,0.8)';
      minimapCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

      minimapCtx.fillStyle = 'rgba(255,255,255,0.15)';
      for (const w of walls) {
        minimapCtx.fillRect(w.x * scale, w.y * scale, Math.max(w.w * scale, 1), Math.max(w.h * scale, 1));
      }

      // Doors on minimap
      for (const d of doors) {
        minimapCtx.fillStyle = d.closed ? 'rgba(255,60,60,0.9)' : 'rgba(100,255,100,0.15)';
        minimapCtx.fillRect(d.x * scale, d.y * scale, Math.max(d.w * scale, 2), Math.max(d.h * scale, 2));
      }

      // Task locations on minimap
      for (const t of taskLocations) {
        if (t.done) continue;
        minimapCtx.fillStyle = 'rgba(255,215,0,0.5)';
        minimapCtx.beginPath();
        minimapCtx.arc(t.x * scale, t.y * scale, 2, 0, Math.PI * 2);
        minimapCtx.fill();
      }

      // Vents on minimap (impostor only)
      if (isImpostor) {
        for (const v of vents) {
          minimapCtx.fillStyle = 'rgba(100,100,100,0.8)';
          minimapCtx.fillRect(v.x * scale - 2, v.y * scale - 1.5, 4, 3);
        }
      }

      for (const npc of npcs) {
        if (!npc.alive) continue;
        minimapCtx.fillStyle = npc.color;
        minimapCtx.beginPath();
        minimapCtx.arc(npc.x * scale, npc.y * scale, 3, 0, Math.PI * 2);
        minimapCtx.fill();
      }

      if (player.alive) {
        minimapCtx.fillStyle = player.color;
        minimapCtx.beginPath();
        minimapCtx.arc(player.x * scale, player.y * scale, 4, 0, Math.PI * 2);
        minimapCtx.fill();
        minimapCtx.strokeStyle = '#fff';
        minimapCtx.lineWidth = 1;
        minimapCtx.stroke();
      }
    }

    function updateActivityLog() {
      const log = document.getElementById('npcActivity');
      const lines = [];
      lines.push(MAPS[selectedMap].name);
      const aliveCount = npcs.filter(n => n.alive).length + (player.alive ? 1 : 0);
      lines.push('Alive: ' + aliveCount + '/10');
      log.innerHTML = lines.join('<br>');
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const ox = player.x - canvas.width / 2;
      const oy = player.y - canvas.height / 2;

      drawMap(ox, oy);

      for (const body of deadBodies) {
        drawDeadBody(ctx, body.x - ox, body.y - oy, body.color);
      }

      for (const npc of npcs) {
        if (!inVent || dist(player, npc) < 100) {
          drawCrewmate(ctx, npc.x - ox, npc.y - oy, npc.w, npc.h, npc.color, npc.name, npc.alive, npc.state);
        }
      }

      if (player.alive && !inVent) {
        drawCrewmate(ctx, player.x - ox, player.y - oy, player.w, player.h, player.color, player.name, true, playerDoingTask ? AI_STATE.DOING_TASK : null);
      }

      // Vision fog of war
      if (player.alive && !isImpostor) {
        const cx = canvas.width / 2 + player.w / 2;
        const cy = canvas.height / 2 + player.h / 2;
        const gradient = ctx.createRadialGradient(cx, cy, visionRadius * 0.7, cx, cy, visionRadius);
        gradient.addColorStop(0, 'rgba(0,0,0,0)');
        gradient.addColorStop(1, 'rgba(0,0,0,0.85)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // In-vent overlay
      if (inVent) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#aaa';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('HIDING IN VENT', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '16px Arial';
        ctx.fillText('V = Exit | E = Travel', canvas.width / 2, canvas.height / 2 + 15);
      }

      // Kill flash effect
      if (killFlash > 0) {
        ctx.fillStyle = 'rgba(255,0,0,' + (killFlash / 15) * 0.4 + ')';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        killFlash--;
      }

      // Security camera overlay
      if (viewingCameras && cameras.length > 0) {
        drawCameraOverlay();
      }

      drawMinimap();
    }

    function drawCameraOverlay() {
      const cw = canvas.width, ch = canvas.height;
      const FEED_VIEW = 280; // world-units visible around each camera

      // Dark overlay behind camera UI
      ctx.fillStyle = 'rgba(0,0,0,0.82)';
      ctx.fillRect(0, 0, cw, ch);

      // Camera feed grid layout
      const numCams = cameras.length; // 4
      const cols = 2, rows = Math.ceil(numCams / cols);
      const padding = 16;
      const titleBarH = 48;
      const feedW = Math.floor((cw - padding * (cols + 1)) / cols);
      const feedH = Math.floor((ch - titleBarH - padding * (rows + 1)) / rows);

      // Title bar
      ctx.fillStyle = '#0a1a0a';
      ctx.fillRect(0, 0, cw, titleBarH);
      ctx.strokeStyle = '#2a5a2a';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, titleBarH); ctx.lineTo(cw, titleBarH); ctx.stroke();

      // Title text
      ctx.fillStyle = '#4aff4a';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.fillText('SECURITY SYSTEM  //  SKELD CCTV NETWORK', 20, 32);

      // Timestamp
      const now = new Date();
      const ts = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ':' + now.getSeconds().toString().padStart(2,'0');
      ctx.textAlign = 'right';
      ctx.fillStyle = '#2aaa2a';
      ctx.font = '14px "Courier New", monospace';
      ctx.fillText('REC ● ' + ts, cw - 20, 32);

      // Draw each camera feed
      for (let i = 0; i < numCams; i++) {
        const cam = cameras[i];
        const col = i % cols, row = Math.floor(i / cols);
        const fx = padding + col * (feedW + padding);
        const fy = titleBarH + padding + row * (feedH + padding);

        // Feed background (very dark green-tinted like CCTV)
        ctx.fillStyle = '#030a03';
        ctx.fillRect(fx, fy, feedW, feedH);

        // Render a scaled-down view of the world around this camera
        ctx.save();
        ctx.beginPath();
        ctx.rect(fx, fy, feedW, feedH);
        ctx.clip();

        const scale = Math.min(feedW, feedH) / (FEED_VIEW * 2);
        const worldOx = cam.x - FEED_VIEW;
        const worldOy = cam.y - FEED_VIEW;

        ctx.translate(fx, fy);
        ctx.scale(scale, scale);
        ctx.translate(-worldOx, -worldOy);

        // Draw map background
        ctx.fillStyle = mapTheme.bg;
        ctx.fillRect(worldOx - 50, worldOy - 50, FEED_VIEW * 2 + 100, FEED_VIEW * 2 + 100);

        // Draw floors visible in this camera area
        if (mapTheme.floors) {
          const rooms2 = rooms;
          for (let fi = 0; fi < mapTheme.floors.length; fi++) {
            const f = mapTheme.floors[fi];
            ctx.fillStyle = fi < rooms2.length ? (roomFloorColors[rooms2[fi].name] || '#222228') : 'rgba(120,120,150,0.5)';
            ctx.fillRect(f.x, f.y, f.w, f.h);
          }
        }

        // Draw walls in view
        ctx.fillStyle = mapTheme.wall;
        for (const wall of walls) {
          ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
        }

        // Draw entities visible in this camera's view area
        const camViewLeft = cam.x - FEED_VIEW, camViewRight = cam.x + FEED_VIEW;
        const camViewTop = cam.y - FEED_VIEW, camViewBot = cam.y + FEED_VIEW;

        // Dead bodies
        for (const body of deadBodies) {
          if (body.x >= camViewLeft && body.x <= camViewRight && body.y >= camViewTop && body.y <= camViewBot) {
            drawDeadBody(ctx, body.x, body.y, body.color);
          }
        }

        // NPCs and player
        const allEntities = [...npcs];
        if (!inVent) allEntities.push({ ...player, isPlayer: true });
        for (const ent of allEntities) {
          if (ent.x >= camViewLeft && ent.x <= camViewRight && ent.y >= camViewTop && ent.y <= camViewBot) {
            if (ent.alive !== false) {
              drawCrewmate(ctx, ent.x, ent.y, ent.w || 32, ent.h || 40, ent.color, '', true, null);
            }
          }
        }

        ctx.restore();

        // Green-tinted scanline overlay for CRT effect
        ctx.save();
        ctx.beginPath();
        ctx.rect(fx, fy, feedW, feedH);
        ctx.clip();
        ctx.fillStyle = 'rgba(0,255,0,0.03)';
        for (let sl = 0; sl < feedH; sl += 3) ctx.fillRect(fx, fy + sl, feedW, 1);
        // Subtle vignette
        const vign = ctx.createRadialGradient(fx+feedW/2, fy+feedH/2, feedH*0.2, fx+feedW/2, fy+feedH/2, feedH*0.7);
        vign.addColorStop(0, 'rgba(0,0,0,0)');
        vign.addColorStop(1, 'rgba(0,20,0,0.5)');
        ctx.fillStyle = vign;
        ctx.fillRect(fx, fy, feedW, feedH);
        ctx.restore();

        // Camera crosshair at camera center
        const screenCx = fx + feedW/2, screenCy = fy + feedH/2;
        ctx.strokeStyle = 'rgba(0,200,0,0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(screenCx - 12, screenCy); ctx.lineTo(screenCx + 12, screenCy);
        ctx.moveTo(screenCx, screenCy - 12); ctx.lineTo(screenCx, screenCy + 12);
        ctx.stroke();

        // Feed border (green, active cameras glow)
        ctx.strokeStyle = '#1a5a1a';
        ctx.lineWidth = 2;
        ctx.strokeRect(fx, fy, feedW, feedH);

        // Camera label bar at bottom of feed
        ctx.fillStyle = 'rgba(0,20,0,0.85)';
        ctx.fillRect(fx, fy + feedH - 24, feedW, 24);
        ctx.fillStyle = '#3aff3a';
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.fillText('CAM ' + (i + 1) + ' — ' + cam.name.toUpperCase(), fx + 8, fy + feedH - 8);

        // REC indicator blink
        if (Math.floor(Date.now() / 800) % 2 === 0) {
          ctx.fillStyle = '#ff3a3a';
          ctx.beginPath(); ctx.arc(fx + feedW - 16, fy + feedH - 12, 4, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#ff8a8a';
          ctx.font = '10px "Courier New", monospace';
          ctx.textAlign = 'right';
          ctx.fillText('REC', fx + feedW - 22, fy + feedH - 8);
        }
      }

      // Exit hint at bottom
      ctx.fillStyle = 'rgba(0,200,0,0.5)';
      ctx.font = '14px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('[ E ] or [ ESC ] — Exit Security View', cw / 2, ch - 12);
    }

    let frameCount = 0;
    function gameLoop() {
      if (!gameStarted || gameOver) return;
      frameCount++;
      updatePlayer();
      updateNPCs();
      updateDoors();
      updateSabotage();
      // Holding E to fix sabotage
      if (keys['e'] && sabotage.active && !isImpostor) fixSabotage();
      // Auto-close camera view if player walks away from Security or comms go down
      if (viewingCameras) {
        if (dist(player, SECURITY_MONITOR) > 100 || (sabotage.active && sabotage.type === 'comms')) {
          viewingCameras = false;
        }
      }
      checkInteractions();
      if (frameCount % 60 === 0) updateActivityLog();
      render();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (!gameStarted || gameOver) return;
      if (e.key.toLowerCase() === 'e') {
        if (inVent) { ventTravel(); } else { doTask(); }
      }
      if (e.key === ' ' && isImpostor) { e.preventDefault(); doKill(); }
      if (e.key.toLowerCase() === 'r') reportBody();
      if (e.key.toLowerCase() === 'v' && isImpostor) {
        if (inVent) { exitVent(); } else { enterVent(); }
      }
      if (e.key.toLowerCase() === 'c' && isImpostor) {
        const doorRoom = getNearbyDoorRoom();
        if (doorRoom) closeDoor(doorRoom);
      }
      if (e.key.toLowerCase() === 'q' && isImpostor) {
        const sabControls = document.getElementById('sabotageControls');
        if (sabControls.style.display === 'flex') {
          sabControls.style.display = 'none';
        } else if (!sabotage.active && sabotage.cooldown <= 0) {
          sabControls.style.display = 'flex';
        }
      }
      if (e.key === 'Escape') {
        viewingCameras = false;
      }
    });
    document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('startScreen').style.display = 'none';
      gameStarted = true;
      init();
      requestAnimationFrame(gameLoop);
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      document.getElementById('gameOverScreen').style.display = 'none';
      init();
      gameOver = false;
      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
</html>
