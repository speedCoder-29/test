<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Among Us</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: Arial, sans-serif; }
    canvas { display: block; }

    #startScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #fff; z-index: 100;
    }
    #startScreen h1 { font-size: 60px; color: #c51111; text-shadow: 3px 3px 0 #000; margin-bottom: 10px; }
    #startScreen .tagline { color: #aaa; margin-bottom: 30px; font-size: 18px; }
    .color-picker { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; max-width: 320px; }
    .color-swatch {
      width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
      border: 3px solid transparent; transition: transform 0.15s, border-color 0.15s;
    }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.selected { border-color: #fff; transform: scale(1.2); }
    #nameInput {
      padding: 12px 20px; font-size: 18px; border: 2px solid #555; border-radius: 8px;
      background: rgba(255,255,255,0.1); color: #fff; text-align: center; width: 250px;
      outline: none; margin-bottom: 20px;
    }
    #nameInput:focus { border-color: #c51111; }
    #startBtn {
      padding: 15px 50px; font-size: 22px; background: #c51111; color: #fff;
      border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
    }
    #startBtn:hover { background: #e01515; }
    .controls-info { color: #666; font-size: 14px; margin-top: 20px; }
    .map-select { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; max-width: 600px; }
    .map-card {
      width: 105px; padding: 10px 8px; border-radius: 10px; cursor: pointer;
      border: 3px solid transparent; text-align: center; transition: transform 0.15s, border-color 0.15s;
    }
    .map-card:hover { transform: scale(1.08); }
    .map-card.selected { border-color: #fff; transform: scale(1.1); }
    .map-card .map-icon { font-size: 28px; margin-bottom: 4px; }
    .map-card .map-name { font-size: 12px; font-weight: bold; color: #fff; }
    .map-card .map-size { font-size: 10px; color: rgba(255,255,255,0.5); }

    #taskBar {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
      width: 300px; height: 22px; background: rgba(0,0,0,0.6); border: 2px solid #555;
      border-radius: 11px; overflow: hidden; z-index: 10;
    }
    #taskFill { height: 100%; background: #4ecdc4; width: 0%; transition: width 0.3s; }
    #taskText {
      position: absolute; top: 0; left: 0; width: 100%; text-align: center;
      color: #fff; font-size: 13px; line-height: 22px; font-weight: bold; text-shadow: 1px 1px 1px #000;
    }
    #roleTag {
      position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
      font-size: 20px; font-weight: bold; padding: 5px 20px; border-radius: 8px;
      text-shadow: 1px 1px 2px #000; animation: fadeRole 3s forwards; z-index: 10;
    }
    @keyframes fadeRole { 0%,70% { opacity: 1; } 100% { opacity: 0; } }
    #interactHint {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 16px; background: rgba(0,0,0,0.7); padding: 8px 20px;
      border-radius: 8px; display: none; z-index: 10;
    }
    #killCooldown {
      position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
      color: #ff4444; font-size: 14px; font-weight: bold; display: none; z-index: 10;
    }
    #npcActivity {
      position: fixed; top: 50px; right: 15px; color: rgba(255,255,255,0.4);
      font-size: 12px; z-index: 10; text-align: right; line-height: 1.6;
    }
    #sabotageHUD {
      position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
      color: #ff4444; font-size: 22px; font-weight: bold; display: none; z-index: 20;
      text-shadow: 0 0 10px #ff0000; animation: pulse 0.5s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }
    #sabotageBar {
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
      width: 250px; height: 14px; background: rgba(0,0,0,0.6); border: 2px solid #ff4444;
      border-radius: 7px; overflow: hidden; display: none; z-index: 20;
    }
    #sabotageFill { height: 100%; background: #ff4444; width: 100%; transition: width 0.3s; }
    #sabotageControls {
      position: fixed; bottom: 160px; left: 50%; transform: translateX(-50%);
      display: none; gap: 10px; z-index: 10;
    }
    .sab-btn {
      padding: 8px 16px; font-size: 14px; border: 2px solid #ff4444; border-radius: 8px;
      background: rgba(255,0,0,0.15); color: #ff4444; cursor: pointer; font-weight: bold;
    }
    .sab-btn:hover { background: rgba(255,0,0,0.3); }
    .sab-btn:disabled { opacity: 0.3; cursor: default; }
    #taskProgress {
      position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
      width: 200px; height: 12px; background: rgba(0,0,0,0.6); border: 2px solid #4ecdc4;
      border-radius: 6px; overflow: hidden; display: none; z-index: 10;
    }
    #taskProgressFill { height: 100%; background: #4ecdc4; width: 0%; transition: width 0.05s; }
    #ventHint {
      position: fixed; bottom: 45px; left: 50%; transform: translateX(-50%);
      color: #aaa; font-size: 13px; display: none; z-index: 10;
    }
    #reportScreen, #voteScreen, #gameOverScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: none; flex-direction: column;
      justify-content: center; align-items: center; color: #fff; z-index: 50;
    }
    #reportScreen h1 { font-size: 50px; color: #ff4444; margin-bottom: 10px; }
    #reportScreen p { color: #aaa; font-size: 18px; }
    #voteScreen h2 { font-size: 28px; margin-bottom: 20px; color: #ffd700; }
    .vote-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; max-height: 400px; overflow-y: auto; }
    .vote-btn {
      padding: 12px 30px; font-size: 16px; border: 2px solid #555; border-radius: 8px;
      background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; pointer-events: auto;
      display: flex; align-items: center; gap: 12px; min-width: 250px; transition: background 0.15s;
    }
    .vote-btn:hover { background: rgba(255,255,255,0.2); }
    .vote-dot { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }
    .vote-count { margin-left: auto; color: #ffd700; font-weight: bold; }
    #voteResult { font-size: 22px; margin-top: 15px; }
    #gameOverScreen h1 { font-size: 50px; margin-bottom: 15px; }
    #gameOverScreen p { font-size: 20px; color: #aaa; margin-bottom: 25px; }
    #restartBtn {
      padding: 12px 40px; font-size: 18px; background: #c51111; color: #fff;
      border: none; border-radius: 8px; cursor: pointer; pointer-events: auto; font-weight: bold;
    }
    #minimap {
      position: fixed; bottom: 15px; right: 15px; width: 180px; height: 135px;
      background: rgba(0,0,0,0.6); border: 2px solid #555; border-radius: 8px; z-index: 10;
    }
    .home-link {
      position: fixed; top: 15px; left: 15px; color: rgba(255,255,255,0.5);
      text-decoration: none; font-size: 14px; z-index: 200;
    }
    .home-link:hover { color: #fff; }
  </style>
</head>
<body>
  <a href="index.html" class="home-link">&larr; Home</a>
  <canvas id="game"></canvas>

  <div id="startScreen">
    <h1>AMONG US</h1>
    <p class="tagline">Complete tasks or find the impostor!</p>
    <p style="color:#888; margin-bottom:10px; font-size:14px;">Choose your color:</p>
    <div class="color-picker" id="colorPicker"></div>
    <p style="color:#888; margin-bottom:8px; font-size:14px;">Choose a map:</p>
    <div class="map-select" id="mapSelect"></div>
    <input type="text" id="nameInput" placeholder="Enter your name" maxlength="12">
    <button id="startBtn">PLAY</button>
    <p class="controls-info">WASD to move | E to interact | R to report | Space to kill | V to vent | C to close doors | Q to sabotage (impostor)</p>
  </div>

  <div id="taskBar"><div id="taskFill"></div><div id="taskText">Tasks: 0/8</div></div>
  <div id="roleTag"></div>
  <div id="interactHint"></div>
  <div id="killCooldown"></div>
  <div id="npcActivity"></div>
  <div id="sabotageHUD"></div>
  <div id="sabotageBar"><div id="sabotageFill"></div></div>
  <div id="sabotageControls">
    <button class="sab-btn" id="sabLights" onclick="startSabotage('lights')">Fix Lights</button>
    <button class="sab-btn" id="sabO2" onclick="startSabotage('o2')">O2 Depleted</button>
    <button class="sab-btn" id="sabReactor" onclick="startSabotage('reactor')">Reactor Meltdown</button>
    <button class="sab-btn" id="sabComms" onclick="startSabotage('comms')">Comms Sabotaged</button>
  </div>
  <div id="taskProgress"><div id="taskProgressFill"></div></div>
  <div id="ventHint"></div>
  <canvas id="minimap"></canvas>

  <div id="reportScreen"><h1>DEAD BODY REPORTED</h1><p>Emergency meeting called...</p></div>
  <div id="voteScreen">
    <h2>Who is the Impostor?</h2>
    <div class="vote-list" id="voteList"></div>
    <div id="voteResult"></div>
  </div>
  <div id="gameOverScreen">
    <h1 id="winTitle"></h1>
    <p id="winDesc"></p>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimap');
    const minimapCtx = minimapCanvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    minimapCanvas.width = 180;
    minimapCanvas.height = 135;

    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

    const COLORS = [
      { name: 'Red', hex: '#c51111' }, { name: 'Blue', hex: '#132ed1' },
      { name: 'Green', hex: '#117f2d' }, { name: 'Pink', hex: '#ed54ba' },
      { name: 'Orange', hex: '#ef7d0e' }, { name: 'Yellow', hex: '#f5f557' },
      { name: 'Black', hex: '#3f474e' }, { name: 'White', hex: '#d6e0f0' },
      { name: 'Purple', hex: '#6b2fbb' }, { name: 'Brown', hex: '#71491e' },
      { name: 'Cyan', hex: '#38fedc' }, { name: 'Lime', hex: '#50ef39' }
    ];

    let selectedColor = 0;
    const colorPicker = document.getElementById('colorPicker');
    COLORS.forEach((c, i) => {
      const swatch = document.createElement('div');
      swatch.className = 'color-swatch' + (i === 0 ? ' selected' : '');
      swatch.style.background = c.hex;
      swatch.onclick = () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
        swatch.classList.add('selected');
        selectedColor = i;
      };
      colorPicker.appendChild(swatch);
    });

    // ===== MAP DEFINITIONS =====
    // ===== ACCURATE AMONG US MAP LAYOUTS =====
    // Each map has rooms connected by hallways (open corridors between rooms)
    // Walls define room boundaries with gaps for doorways
    // Hallway floors are drawn to show connections

    function borderWalls(w, h) {
      return [
        { x: 0, y: 0, w: w, h: 16 }, { x: 0, y: h - 16, w: w, h: 16 },
        { x: 0, y: 0, w: 16, h: h }, { x: w - 16, y: 0, w: 16, h: h },
      ];
    }

    const MAPS = {
      // ========== THE SKELD ==========
      // Matches the real Skeld map image: oval spaceship hull, 14 rooms
      // Cafeteria large top-center with 5 tables, Reactor tall left with core
      // Admin center with map table, Storage bottom with crates
      // Electrical cramped bottom-left, Navigation at ship nose
      skeld: {
        name: 'The Skeld', icon: '\u{1F680}', desc: 'Classic spaceship',
        width: 3200, height: 2000,
        bgColor: '#0a0a18', wallColor: '#4a4a60', floorColor: 'rgba(180,180,255,0.04)', gridColor: 'rgba(255,255,255,0.025)',
        spawnX: 1450, spawnY: 320,
        emergencyBtn: { x: 1450, y: 290, radius: 22 },
        sabotageFixLocations: {
          lights: { x: 700, y: 1450 },        // Electrical room light panel
          o2: { x: 2050, y: 770 },             // O2 room + Admin room number pads
          reactor: { x: 220, y: 710 },          // Reactor room hand readers
          comms: { x: 1910, y: 1300 },          // Communications room radio dial
        },
        walls: (function() {
          const w = [];

          // ============ SHIP HULL (oval spaceship outline) ============
          // Top hull - left side
          w.push({ x: 60, y: 130, w: 16, h: 80 });    // top-left corner
          w.push({ x: 60, y: 130, w: 200, h: 16 });    // top edge far left
          w.push({ x: 244, y: 80, w: 16, h: 66 });     // upper engine top-left jog
          w.push({ x: 244, y: 80, w: 700, h: 16 });     // top edge to medbay/cafeteria
          // Top hull - cafeteria bulge
          w.push({ x: 928, y: 50, w: 16, h: 46 });      // cafeteria top-left jog
          w.push({ x: 928, y: 50, w: 900, h: 16 });      // top edge across cafeteria
          w.push({ x: 1812, y: 50, w: 16, h: 46 });     // cafeteria top-right jog
          // Top hull - right side to weapons
          w.push({ x: 1812, y: 80, w: 430, h: 16 });    // top edge to weapons
          w.push({ x: 2226, y: 80, w: 16, h: 50 });     // weapons top jog up
          w.push({ x: 2226, y: 50, w: 350, h: 16 });    // weapons top
          w.push({ x: 2560, y: 50, w: 16, h: 200 });    // weapons right wall going down
          // Right hull - stepped taper to navigation nose
          w.push({ x: 2560, y: 234, w: 200, h: 16 });   // step to nav area
          w.push({ x: 2744, y: 234, w: 16, h: 250 });   // right upper wall
          w.push({ x: 2744, y: 468, w: 200, h: 16 });   // step inward
          w.push({ x: 2928, y: 468, w: 16, h: 180 });   // nav upper right
          w.push({ x: 2928, y: 632, w: 150, h: 16 });   // nav top
          w.push({ x: 3062, y: 632, w: 16, h: 340 });   // nav right (ship nose tip)
          w.push({ x: 2928, y: 956, w: 150, h: 16 });   // nav bottom
          w.push({ x: 2928, y: 956, w: 16, h: 180 });   // nav lower right
          w.push({ x: 2744, y: 1120, w: 200, h: 16 });  // step outward
          w.push({ x: 2744, y: 1120, w: 16, h: 250 });  // right lower wall
          w.push({ x: 2560, y: 1354, w: 200, h: 16 });  // step to shields
          w.push({ x: 2560, y: 1354, w: 16, h: 220 });  // shields right wall
          // Bottom hull
          w.push({ x: 2226, y: 1558, w: 350, h: 16 });  // shields bottom
          w.push({ x: 2226, y: 1558, w: 16, h: 50 });   // shields jog
          w.push({ x: 1812, y: 1592, w: 430, h: 16 });  // bottom edge right
          w.push({ x: 1812, y: 1592, w: 16, h: 46 });   // jog
          w.push({ x: 928, y: 1622, w: 900, h: 16 });   // bottom edge across storage
          w.push({ x: 928, y: 1622, w: 16, h: 46 });    // storage jog
          w.push({ x: 244, y: 1592, w: 700, h: 16 });   // bottom edge to engines
          w.push({ x: 244, y: 1522, w: 16, h: 86 });    // lower engine jog
          w.push({ x: 60, y: 1522, w: 200, h: 16 });    // bottom far left
          // Left hull - reactor bulge with engine exhausts
          w.push({ x: 60, y: 194, w: 16, h: 200 });     // left upper wall
          w.push({ x: 30, y: 378, w: 46, h: 16 });      // reactor top-left step
          w.push({ x: 30, y: 378, w: 16, h: 850 });     // reactor left wall (full height)
          w.push({ x: 30, y: 1212, w: 46, h: 16 });     // reactor bottom-left step
          w.push({ x: 60, y: 1212, w: 16, h: 326 });    // left lower wall

          // ============ INTERIOR ROOM WALLS ============

          // --- Upper Engine (top-left, small room with engine) ---
          w.push({ x: 140, y: 130, w: 16, h: 70 });     // left inner
          w.push({ x: 140, y: 130, w: 120, h: 16 });    // top inner
          w.push({ x: 414, y: 96, w: 16, h: 150 });     // right top
          w.push({ x: 414, y: 310, w: 16, h: 100 });    // right bottom
          w.push({ x: 140, y: 394, w: 120, h: 16 });    // bottom left
          w.push({ x: 330, y: 394, w: 100, h: 16 });    // bottom right

          // --- Lower Engine (bottom-left, mirrors upper) ---
          w.push({ x: 140, y: 1210, w: 120, h: 16 });   // top left
          w.push({ x: 330, y: 1210, w: 100, h: 16 });   // top right
          w.push({ x: 414, y: 1210, w: 16, h: 100 });   // right top
          w.push({ x: 414, y: 1374, w: 16, h: 150 });   // right bottom
          w.push({ x: 140, y: 1522, w: 16, h: 70 });    // left inner
          w.push({ x: 140, y: 1508, w: 120, h: 16 });   // bottom inner

          // --- Reactor (far left, tall room with reactor core) ---
          // Reactor is FULLY enclosed - no direct connection to Security
          w.push({ x: 60, y: 378, w: 16, h: 60 });
          w.push({ x: 380, y: 420, w: 16, h: 584 });    // right wall (SOLID - no gap to Security)
          w.push({ x: 76, y: 420, w: 320, h: 16 });     // top
          w.push({ x: 76, y: 1004, w: 150, h: 16 });    // bottom left
          w.push({ x: 290, y: 1004, w: 106, h: 16 });   // bottom right
          // Reactor exit is through the top or bottom (to engine corridors)

          // --- Security (small room, separated from Reactor by solid wall) ---
          // Security is accessed from the left vertical corridor, not from Reactor
          w.push({ x: 396, y: 560, w: 16, h: 120 });    // left wall top
          w.push({ x: 396, y: 760, w: 16, h: 84 });     // left wall bottom (gap = door)
          w.push({ x: 580, y: 560, w: 16, h: 300 });    // right wall
          w.push({ x: 396, y: 560, w: 200, h: 16 });    // top wall
          w.push({ x: 396, y: 844, w: 200, h: 16 });    // bottom wall

          // --- MedBay (left-center top, between engines and cafeteria) ---
          w.push({ x: 520, y: 120, w: 16, h: 150 });    // left top
          w.push({ x: 520, y: 340, w: 16, h: 90 });     // left bottom
          w.push({ x: 520, y: 120, w: 360, h: 16 });    // top
          w.push({ x: 864, y: 120, w: 16, h: 320 });    // right
          w.push({ x: 520, y: 424, w: 360, h: 16 });    // bottom

          // --- Cafeteria (LARGE octagonal room, top center - spawn) ---
          w.push({ x: 970, y: 96, w: 16, h: 150 });     // left top
          w.push({ x: 970, y: 330, w: 16, h: 170 });    // left bottom
          w.push({ x: 970, y: 96, w: 880, h: 16 });      // top
          w.push({ x: 1834, y: 96, w: 16, h: 150 });    // right top
          w.push({ x: 1834, y: 330, w: 16, h: 170 });   // right bottom
          w.push({ x: 970, y: 484, w: 280, h: 16 });    // bottom left
          w.push({ x: 1400, y: 484, w: 200, h: 16 });   // bottom center
          w.push({ x: 1670, y: 484, w: 180, h: 16 });   // bottom right

          // --- Weapons (top right, angular/wedge shape) ---
          w.push({ x: 2050, y: 96, w: 16, h: 130 });    // left top
          w.push({ x: 2050, y: 310, w: 16, h: 160 });   // left bottom
          w.push({ x: 2050, y: 96, w: 200, h: 16 });    // top left part
          w.push({ x: 2050, y: 454, w: 180, h: 16 });   // bottom left
          w.push({ x: 2310, y: 454, w: 180, h: 16 });   // bottom right

          // --- O2 (right center, below weapons) ---
          w.push({ x: 1920, y: 580, w: 16, h: 130 });   // left top
          w.push({ x: 1920, y: 790, w: 16, h: 130 });   // left bottom
          w.push({ x: 1920, y: 580, w: 380, h: 16 });   // top
          w.push({ x: 2284, y: 580, w: 16, h: 340 });   // right
          w.push({ x: 1920, y: 904, w: 380, h: 16 });   // bottom

          // --- Navigation (far right, ship nose) ---
          w.push({ x: 2550, y: 550, w: 16, h: 150 });   // left top
          w.push({ x: 2550, y: 780, w: 16, h: 170 });   // left bottom
          w.push({ x: 2550, y: 550, w: 380, h: 16 });   // top
          w.push({ x: 2550, y: 934, w: 380, h: 16 });   // bottom

          // --- Admin (center of ship, map table room) ---
          w.push({ x: 1380, y: 660, w: 16, h: 120 });   // left top
          w.push({ x: 1380, y: 860, w: 16, h: 130 });   // left bottom
          w.push({ x: 1380, y: 660, w: 420, h: 16 });   // top
          w.push({ x: 1784, y: 660, w: 16, h: 330 });   // right
          w.push({ x: 1380, y: 974, w: 420, h: 16 });   // bottom

          // --- Electrical (bottom-left, cramped single entrance) ---
          w.push({ x: 520, y: 1160, w: 16, h: 70 });    // left (entrance gap!)
          w.push({ x: 520, y: 1310, w: 16, h: 300 });   // left below entrance
          w.push({ x: 520, y: 1160, w: 400, h: 16 });   // top
          w.push({ x: 904, y: 1160, w: 16, h: 450 });   // right
          w.push({ x: 520, y: 1594, w: 400, h: 16 });   // bottom

          // --- Storage (LARGE room, bottom center) ---
          w.push({ x: 1020, y: 1100, w: 16, h: 180 });  // left top
          w.push({ x: 1020, y: 1370, w: 16, h: 260 });  // left bottom
          w.push({ x: 1020, y: 1100, w: 200, h: 16 });  // top left
          w.push({ x: 1340, y: 1100, w: 200, h: 16 });  // top right
          w.push({ x: 1524, y: 1100, w: 16, h: 180 });  // right top
          w.push({ x: 1524, y: 1370, w: 16, h: 260 });  // right bottom
          w.push({ x: 1020, y: 1614, w: 520, h: 16 });  // bottom

          // --- Communications (bottom right) ---
          w.push({ x: 1740, y: 1100, w: 16, h: 130 });  // left top
          w.push({ x: 1740, y: 1320, w: 16, h: 200 });  // left bottom
          w.push({ x: 1740, y: 1100, w: 360, h: 16 });  // top
          w.push({ x: 2084, y: 1100, w: 16, h: 420 });  // right
          w.push({ x: 1740, y: 1504, w: 360, h: 16 });  // bottom

          // --- Shields (bottom far right) ---

    function dist(a, b) {
      return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
    }

    function distXY(ax, ay, bx, by) {
      return Math.sqrt((ax - bx) ** 2 + (ay - by) ** 2);
    }

    function rectCollision(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function isBlockedAt(nx, ny, ew, eh) {
      for (const w of walls) {
        if (rectCollision(nx, ny, ew, eh, w.x, w.y, w.w, w.h)) return true;
      }
      // Closed doors act as walls
      for (const d of doors) {
        if (d.closed && rectCollision(nx, ny, ew, eh, d.x, d.y, d.w, d.h)) return true;
      }
      return false;
    }

    function tryMove(entity, dx, dy) {
      // Try full move
      let nx = entity.x + dx;
      let ny = entity.y + dy;
      if (!isBlockedAt(nx, ny, entity.w, entity.h)) { entity.x = nx; entity.y = ny; return true; }

      // Try horizontal only
      nx = entity.x + dx;
      ny = entity.y;
      if (!isBlockedAt(nx, ny, entity.w, entity.h)) { entity.x = nx; return true; }

      // Try vertical only
      nx = entity.x;
      ny = entity.y + dy;
      if (!isBlockedAt(nx, ny, entity.w, entity.h)) { entity.y = ny; return true; }

      return false;
    }

    function getNearbyEntities(npc, range) {
      const nearby = [];
      if (player.alive && dist(npc, player) < range) nearby.push(player);
      for (const other of npcs) {
        if (other !== npc && other.alive && dist(npc, other) < range) nearby.push(other);
      }
      return nearby;
    }

    function canSee(a, b) {
      return dist(a, b) < 300;
    }

    function moveTowardDirect(npc, tx, ty) {
      const dx = tx - npc.x;
      const dy = ty - npc.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 8) return true;

      let mx = (dx / d) * npc.speed;
      let my = (dy / d) * npc.speed;

      const moved = tryMove(npc, mx, my);

      // Stuck detection - try to go around
      if (!moved || (Math.abs(npc.x - npc.lastX) < 0.5 && Math.abs(npc.y - npc.lastY) < 0.5)) {
        npc.stuckTimer++;
        if (npc.stuckTimer > 30) {
          const perpX = -my;
          const perpY = mx;
          tryMove(npc, perpX * 1.5, perpY * 1.5);
          if (npc.stuckTimer > 90) {
            npc.stuckTimer = 0;
            // Clear path to force recalculation
            npc.navPath = null;
            npc.navIndex = 0;
          }
        }
      } else {
        npc.stuckTimer = 0;
      }
      npc.lastX = npc.x;
      npc.lastY = npc.y;
      return false;
    }

    function moveToward(npc, tx, ty) {
      const dx = tx - npc.x;
      const dy = ty - npc.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 8) { npc.navPath = null; return true; }

      // If close enough, just walk directly
      if (d < 200 && !isBlockedAt(npc.x + (dx/d)*npc.speed, npc.y + (dy/d)*npc.speed, npc.w, npc.h)) {
        return moveTowardDirect(npc, tx, ty);
      }

      // Use waypoint navigation
      if (!npc.navPath || npc.navRecalc-- <= 0) {
        npc.navPath = findPath(npc.x, npc.y, tx, ty);
        npc.navIndex = 0;
        npc.navRecalc = 120; // recalculate every 2 seconds
      }

      if (npc.navPath && npc.navIndex < npc.navPath.length) {
        const wp = npc.navPath[npc.navIndex];
        if (moveTowardDirect(npc, wp.x, wp.y)) {
          npc.navIndex++;
          if (npc.navIndex >= npc.navPath.length) {
            npc.navPath = null;
            // Now walk directly to final target
            return moveTowardDirect(npc, tx, ty);
          }
        }
        return false;
      }

      // Fallback to direct movement
      return moveTowardDirect(npc, tx, ty);
    }

    // Crewmate AI
    function updateCrewmateAI(npc) {
      // Awareness: track nearby players
      const nearby = getNearbyEntities(npc, 200);
      for (const e of nearby) {
        npc.lastSeen[e.name] = { x: e.x, y: e.y, time: Date.now() };
      }

      // NPCs respond to sabotage - head to fix location
      if (sabotage.active && npc.state !== AI_STATE.REPORTING && Math.random() < 0.01) {
        const fixTarget = mapTheme.sabFix[sabotage.type];
        if (fixTarget) {
          npc.targetX = fixTarget.x + (Math.random() - 0.5) * 40;
          npc.targetY = fixTarget.y + (Math.random() - 0.5) * 40;
          npc.state = AI_STATE.WALKING_TO_TASK;
          npc.stateTimer = 0;
          npc.fixingSabotage = true;
        }
      }
      // NPC auto-fixes sabotage when near fix location
      if (sabotage.active && npc.fixingSabotage) {
        const fixTarget = mapTheme.sabFix[sabotage.type];
        if (fixTarget && dist(npc, fixTarget) < 80) {
          sabotage.fixProgress += 0.5;
          if (sabotage.fixProgress >= 100) {
            endSabotage();
            npc.fixingSabotage = false;
          }
        }
      }

      // Check for dead bodies nearby
      for (const body of deadBodies) {
        if (dist(npc, body) < 120 && !npc.sawBody) {
          npc.sawBody = true;
          npc.bodyLocation = { x: body.x, y: body.y };
          npc.state = AI_STATE.REPORTING;
          npc.panicTimer = 60;

          // Suspect anyone they saw nearby
          for (const e of nearby) {
            if (e !== player || !player.alive) continue;
            npc.suspicion[e.name] = (npc.suspicion[e.name] || 0) + 30;
          }
          for (const other of npcs) {
            if (other !== npc && other.alive && dist(npc, other) < 200) {
              npc.suspicion[other.name] = (npc.suspicion[other.name] || 0) + 30;
            }
          }
          return;
        }
      }

      switch (npc.state) {
        case AI_STATE.IDLE:
          npc.idleTimer++;
          if (npc.idleTimer > 40 + Math.random() * 60) {
            npc.idleTimer = 0;
            // Decide what to do
            const hasTask = npc.taskList.some(t => !t.npcDone);
            const roll = Math.random();

            if (hasTask && roll < 0.7) {
              // Go do next task
              const nextTask = npc.taskList.find(t => !t.npcDone);
              if (nextTask) {
                npc.targetX = nextTask.x + (Math.random() - 0.5) * 20;
                npc.targetY = nextTask.y + (Math.random() - 0.5) * 20;
                npc.state = AI_STATE.WALKING_TO_TASK;
                npc.stateTimer = 0;
              }
            } else if (roll < 0.85 && npc.personality.sociability > 0.5) {
              // Follow someone (safety in numbers)
              const others = npcs.filter(n => n !== npc && n.alive && dist(npc, n) < 400);
              if (others.length > 0) {
                npc.companionTarget = others[Math.floor(Math.random() * others.length)];
                npc.state = AI_STATE.FOLLOWING;
                npc.stateTimer = 180 + Math.random() * 300;
              } else {
                npc.targetX = 200 + Math.random() * (MAP_W - 400);
                npc.targetY = 200 + Math.random() * (MAP_H - 400);
                npc.state = AI_STATE.WALKING_RANDOM;
                npc.stateTimer = 120 + Math.random() * 180;
              }
            } else {
              // Random walk
              npc.targetX = 200 + Math.random() * (MAP_W - 400);
              npc.targetY = 200 + Math.random() * (MAP_H - 400);
              npc.state = AI_STATE.WALKING_RANDOM;
              npc.stateTimer = 120 + Math.random() * 180;
            }
          }
          break;

        case AI_STATE.WALKING_TO_TASK:
          npc.stateTimer++;
          if (npc.stateTimer > 600) { npc.state = AI_STATE.IDLE; break; }
          const taskTarget = npc.taskList.find(t => !t.npcDone);
          if (!taskTarget) { npc.state = AI_STATE.IDLE; break; }
          if (moveToward(npc, taskTarget.x, taskTarget.y)) {
            npc.state = AI_STATE.DOING_TASK;
            npc.taskProgress = 0;
            npc.stateTimer = 0;
          }
          break;

        case AI_STATE.DOING_TASK:
          npc.taskProgress += npc.personality.taskSpeed;
          npc.stateTimer++;
          // Stand still while doing task
          if (npc.taskProgress >= 100) {
            const task = npc.taskList.find(t => !t.npcDone);
            if (task) {
              task.npcDone = true;
              npcTasksDone++;
              updateTaskBar();
            }
            npc.state = AI_STATE.IDLE;
            npc.idleTimer = 0;
          }
          break;

        case AI_STATE.WALKING_RANDOM:
          npc.stateTimer--;
          if (npc.stateTimer <= 0 || moveToward(npc, npc.targetX, npc.targetY)) {
            npc.state = AI_STATE.IDLE;
            npc.idleTimer = 0;
          }
          break;

        case AI_STATE.FOLLOWING:
          npc.stateTimer--;
          if (npc.stateTimer <= 0 || !npc.companionTarget || !npc.companionTarget.alive) {
            npc.state = AI_STATE.IDLE;
            npc.idleTimer = 0;
            break;
          }
          // Follow at a distance
          const followDist = dist(npc, npc.companionTarget);
          if (followDist > 60) {
            moveToward(npc, npc.companionTarget.x, npc.companionTarget.y);
          }
          // If companion is doing task, wait nearby
          break;

        case AI_STATE.REPORTING:
          // Run to cafeteria (meeting area) then trigger report
          npc.panicTimer--;
          if (npc.panicTimer > 0) {
            // Panic freeze
          } else {
            // NPC auto-reports after reaching body area (instant for simplicity)
            npc.sawBody = false;
            npc.state = AI_STATE.IDLE;
            // Trigger meeting
            if (deadBodies.length > 0 && !gameOver) {
              triggerNPCReport(npc);
            }
          }
          break;

        case AI_STATE.FLEEING:
          npc.stateTimer--;
          if (npc.stateTimer <= 0) { npc.state = AI_STATE.IDLE; break; }
          moveToward(npc, npc.targetX, npc.targetY);
          break;
      }
    }

    // Impostor AI
    function updateImpostorAI(npc) {
      npc.killCooldown = Math.max(0, npc.killCooldown - 1);

      const nearby = getNearbyEntities(npc, 250);
      const nearbyCrewmates = nearby.filter(e => !e.isImpostor && e.alive);
      const nearbyWitnesses = nearby.length;

      switch (npc.state) {
        case AI_STATE.IDLE:
          npc.idleTimer++;
          if (npc.idleTimer > 30 + Math.random() * 40) {
            npc.idleTimer = 0;
            const roll = Math.random();

            if (npc.killCooldown <= 0 && nearbyCrewmates.length === 1 && nearbyWitnesses <= 1 && roll < 0.6) {
              // Hunt the lone crewmate
              npc.companionTarget = nearbyCrewmates[0];
              npc.state = AI_STATE.HUNTING;
              npc.stateTimer = 180;
            } else if (roll < 0.4) {
              // Fake doing a task
              const task = taskLocations[Math.floor(Math.random() * taskLocations.length)];
              npc.targetX = task.x;
              npc.targetY = task.y;
              npc.state = AI_STATE.FAKING_TASK;
              npc.stateTimer = 0;
              npc.taskProgress = 0;
            } else if (roll < 0.7) {
              // Stalk a crewmate, waiting for them to be alone
              const crewmates = npcs.filter(n => n !== npc && n.alive && !n.isImpostor);
              if (crewmates.length > 0) {
                npc.companionTarget = crewmates[Math.floor(Math.random() * crewmates.length)];
                npc.state = AI_STATE.STALKING;
                npc.stateTimer = 300 + Math.random() * 300;
              }
            } else {
              // Wander to look innocent
              npc.targetX = 200 + Math.random() * (MAP_W - 400);
              npc.targetY = 200 + Math.random() * (MAP_H - 400);
              npc.state = AI_STATE.WALKING_RANDOM;
              npc.stateTimer = 100 + Math.random() * 150;
            }
          }
          break;

        case AI_STATE.HUNTING:
          npc.stateTimer--;
          if (npc.stateTimer <= 0 || !npc.companionTarget || !npc.companionTarget.alive) {
            npc.state = AI_STATE.IDLE; break;
          }
          moveToward(npc, npc.companionTarget.x, npc.companionTarget.y);

          // Try to close doors on victim to trap them
          if (doorCooldown <= 0 && dist(npc, npc.companionTarget) < 150) {
            const victimRoom = getEntityRoom(npc.companionTarget);
            if (victimRoom) {
              const hasDoors = doors.some(d => d.room === victimRoom && !d.closed);
              if (hasDoors) closeDoor(victimRoom);
            }
          }

          // Check if we can kill
          if (dist(npc, npc.companionTarget) < 55 && npc.killCooldown <= 0) {
            // Check for witnesses
            const witnesses = getNearbyEntities(npc, 200).filter(e => e !== npc.companionTarget);
            if (witnesses.length === 0) {
              // KILL
              performNPCKill(npc, npc.companionTarget);
              npc.state = AI_STATE.FLEEING;
              // Flee in opposite direction
              const fleeAngle = Math.atan2(npc.y - npc.companionTarget.y, npc.x - npc.companionTarget.x);
              npc.targetX = npc.x + Math.cos(fleeAngle) * 400;
              npc.targetY = npc.y + Math.sin(fleeAngle) * 400;
              npc.targetX = Math.max(50, Math.min(MAP_W - 50, npc.targetX));
              npc.targetY = Math.max(50, Math.min(MAP_H - 50, npc.targetY));
              npc.stateTimer = 120;
            } else {
              // Too many witnesses, back off
              npc.state = AI_STATE.WALKING_RANDOM;
              npc.targetX = npc.x + (Math.random() - 0.5) * 400;
              npc.targetY = npc.y + (Math.random() - 0.5) * 400;
              npc.stateTimer = 90;
            }
          }
          break;

        case AI_STATE.STALKING:
          npc.stateTimer--;
          if (npc.stateTimer <= 0 || !npc.companionTarget || !npc.companionTarget.alive) {
            npc.state = AI_STATE.IDLE; break;
          }
          // Keep distance but follow
          const stalkDist = dist(npc, npc.companionTarget);
          if (stalkDist > 180) {
            moveToward(npc, npc.companionTarget.x, npc.companionTarget.y);
          } else if (stalkDist < 100) {
            // Too close, back off slightly
          }
          // Check if target is alone
          if (npc.killCooldown <= 0 && stalkDist < 150) {
            const othersNearTarget = getNearbyEntities(npc.companionTarget, 200).filter(e => e !== npc);
            if (othersNearTarget.length === 0) {
              npc.state = AI_STATE.HUNTING;
              npc.stateTimer = 120;
            }
          }
          break;

        case AI_STATE.FAKING_TASK:
          if (npc.stateTimer === 0) {
            // Walk to task location
            if (moveToward(npc, npc.targetX, npc.targetY)) {
              npc.stateTimer = 1;
              npc.taskProgress = 0;
            }
          } else {
            // Pretend to do task
            npc.taskProgress += 0.8;
            if (npc.taskProgress >= 100) {
              npc.state = AI_STATE.IDLE;
              npc.idleTimer = 0;
            }
          }
          break;

        case AI_STATE.WALKING_RANDOM:
          npc.stateTimer--;
          if (npc.stateTimer <= 0 || moveToward(npc, npc.targetX, npc.targetY)) {
            npc.state = AI_STATE.IDLE;
            npc.idleTimer = 0;
          }
          // Opportunistic kill
          if (npc.killCooldown <= 0) {
            for (const cm of nearbyCrewmates) {
              if (dist(npc, cm) < 55) {
                const witnesses = getNearbyEntities(npc, 200).filter(e => e !== cm);
                if (witnesses.length === 0) {
                  performNPCKill(npc, cm);
                  npc.state = AI_STATE.FLEEING;
                  npc.targetX = npc.x + (Math.random() - 0.5) * 500;
                  npc.targetY = npc.y + (Math.random() - 0.5) * 500;
                  npc.stateTimer = 100;
                  break;
                }
              }
            }
          }
          break;

        case AI_STATE.FLEEING:
          npc.stateTimer--;
          if (npc.stateTimer <= 0) { npc.state = AI_STATE.IDLE; break; }
          moveToward(npc, npc.targetX, npc.targetY);
          break;
      }
    }

    function performNPCKill(impostor, victim) {
      if (victim === player) {
        player.alive = false;
        deadBodies.push({ x: player.x, y: player.y, color: player.color, name: player.name });
        killFlash = 20;
        endGame(true);
        return;
      }
      const npcVictim = npcs.find(n => n === victim);
      if (npcVictim) {
        npcVictim.alive = false;
        deadBodies.push({ x: npcVictim.x, y: npcVictim.y, color: npcVictim.color, name: npcVictim.name });
        impostor.killCooldown = 600;

        const aliveCrewmates = npcs.filter(n => n.alive && !n.isImpostor).length + (player.alive && !isImpostor ? 1 : 0);
        const aliveImpostors = npcs.filter(n => n.alive && n.isImpostor).length + (player.alive && isImpostor ? 1 : 0);
        if (aliveImpostors >= aliveCrewmates) endGame(true);
      }
    }

    function triggerNPCReport(reporter) {
      document.getElementById('reportScreen').style.display = 'flex';
      setTimeout(() => {
        document.getElementById('reportScreen').style.display = 'none';
        startVoting(reporter);
      }, 2000);
    }

    function updateNPCs() {
      for (const npc of npcs) {
        if (!npc.alive) continue;
        if (npc.isImpostor) {
          updateImpostorAI(npc);
        } else {
          updateCrewmateAI(npc);
        }
        // Clamp to map
        npc.x = Math.max(25, Math.min(MAP_W - npc.w - 25, npc.x));
        npc.y = Math.max(25, Math.min(MAP_H - npc.h - 25, npc.y));
      }
    }

    // --- Door System ---
    function updateDoors() {
      for (const d of doors) {
        if (d.closed) {
          d.timer--;
          if (d.timer <= 0) {
            d.closed = false;
            d.timer = 0;
          }
        }
      }
      if (doorCooldown > 0) doorCooldown--;
    }

    function closeDoor(roomName) {
      if (!isImpostor || doorCooldown > 0 || gameOver) return false;
      let closed = false;
      for (const d of doors) {
        if (d.room === roomName && !d.closed) {
          d.closed = true;
          d.timer = DOOR_CLOSE_DURATION;
          closed = true;
        }
      }
      if (closed) doorCooldown = DOOR_COOLDOWN;
      return closed;
    }

    function getPlayerRoom() {
      const numRooms = rooms.length;
      const flrs = mapTheme.floors;
      if (!flrs) return null;
      for (let i = 0; i < numRooms && i < flrs.length; i++) {
        const f = flrs[i];
        if (player.x >= f.x && player.x <= f.x + f.w && player.y >= f.y && player.y <= f.y + f.h) {
          return rooms[i].name;
        }
      }
      return null;
    }

    function getEntityRoom(entity) {
      const numRooms = rooms.length;
      const flrs = mapTheme.floors;
      if (!flrs) return null;
      for (let i = 0; i < numRooms && i < flrs.length; i++) {
        const f = flrs[i];
        if (entity.x >= f.x && entity.x <= f.x + f.w && entity.y >= f.y && entity.y <= f.y + f.h) {
          return rooms[i].name;
        }
      }
      return null;
    }

    function getNearbyDoorRoom() {
      // Find the room name of doors near the player (for closing)
      if (!isImpostor) return null;
      const nearRooms = new Set();
      for (const d of doors) {
        if (!d.closed) {
          const dx = (d.x + d.w / 2) - (player.x + player.w / 2);
          const dy = (d.y + d.h / 2) - (player.y + player.h / 2);
          if (Math.sqrt(dx * dx + dy * dy) < 200) {
            nearRooms.add(d.room);
          }
        }
      }
      // Return the first room that has closable doors
      for (const rm of nearRooms) return rm;
      return null;
    }

    // --- Pathfinding (BFS on waypoint graph) ---
    function findNearestWaypoint(x, y) {
      let best = -1, bestDist = Infinity;
      for (let i = 0; i < waypoints.length; i++) {
        const dx = waypoints[i].x - x, dy = waypoints[i].y - y;
        const d = dx * dx + dy * dy;
        if (d < bestDist) { bestDist = d; best = i; }
      }
      return best;
    }

    function findPath(fromX, fromY, toX, toY) {
      if (waypoints.length === 0) return null;
      const startWP = findNearestWaypoint(fromX, fromY);
      const endWP = findNearestWaypoint(toX, toY);
      if (startWP === endWP) return null; // direct walk

      // BFS
      const visited = new Set();
      const queue = [[startWP]];
      visited.add(startWP);
      while (queue.length > 0) {
        const path = queue.shift();
        const node = path[path.length - 1];
        if (node === endWP) {
          // Convert to coordinate path
          return path.map(i => ({ x: waypoints[i].x, y: waypoints[i].y }));
        }
        for (const neighbor of waypointAdj[node]) {
          if (!visited.has(neighbor)) {
            // Check if door blocks this edge
            let doorBlocked = false;
            const wp1 = waypoints[node], wp2 = waypoints[neighbor];
            for (const d of doors) {
              if (d.closed) {
                // Check if door is between these two waypoints
                const midX = (wp1.x + wp2.x) / 2, midY = (wp1.y + wp2.y) / 2;
                const ddx = (d.x + d.w / 2) - midX, ddy = (d.y + d.h / 2) - midY;
                if (Math.sqrt(ddx * ddx + ddy * ddy) < 150) {
                  doorBlocked = true;
                  break;
                }
              }
            }
            if (!doorBlocked) {
              visited.add(neighbor);
              queue.push([...path, neighbor]);
            }
          }
        }
      }
      return null; // no path found
    }

    // --- Sabotage System ---
    function startSabotage(type) {
      if (!isImpostor || sabotage.cooldown > 0 || sabotage.active || gameOver) return;
      sabotage.active = true;
      sabotage.type = type;
      sabotage.fixProgress = 0;
      if (type === 'lights') {
        sabotage.timer = 0; // lights stay off until fixed
        sabotage.maxTime = 0;
        visionRadius = VISION_LIGHTS_OUT;
        document.getElementById('sabotageHUD').textContent = 'FIX LIGHTS - Vision reduced!';
        document.getElementById('sabotageHUD').style.display = 'block';
        document.getElementById('sabotageBar').style.display = 'none';
      } else if (type === 'o2') {
        sabotage.timer = 1800; // 30 seconds to fix
        sabotage.maxTime = 1800;
        document.getElementById('sabotageHUD').textContent = 'OXYGEN DEPLETED';
        document.getElementById('sabotageHUD').style.display = 'block';
        document.getElementById('sabotageBar').style.display = 'block';
      } else if (type === 'reactor') {
        sabotage.timer = 1800; // 30 seconds to fix (requires 2 hand readers)
        sabotage.maxTime = 1800;
        document.getElementById('sabotageHUD').textContent = 'REACTOR MELTDOWN';
        document.getElementById('sabotageHUD').style.display = 'block';
        document.getElementById('sabotageBar').style.display = 'block';
      } else if (type === 'comms') {
        sabotage.timer = 0; // stays until fixed (non-critical)
        sabotage.maxTime = 0;
        document.getElementById('sabotageHUD').textContent = 'COMMS SABOTAGED - Cameras disabled!';
        document.getElementById('sabotageHUD').style.display = 'block';
        document.getElementById('sabotageBar').style.display = 'none';
      }
      document.getElementById('sabotageControls').style.display = 'none';
    }

    function updateSabotage() {
      if (!sabotage.active) {
        sabotage.cooldown = Math.max(0, sabotage.cooldown - 1);
        return;
      }
      if (sabotage.type === 'o2') {
        sabotage.timer--;
        const pct = (sabotage.timer / sabotage.maxTime) * 100;
        document.getElementById('sabotageFill').style.width = pct + '%';
        document.getElementById('sabotageHUD').textContent = 'OXYGEN DEPLETED - ' + Math.ceil(sabotage.timer / 60) + 's';
        if (sabotage.timer <= 0) {
          endGame(true);
          return;
        }
      } else if (sabotage.type === 'reactor') {
        sabotage.timer--;
        const pct = (sabotage.timer / sabotage.maxTime) * 100;
        document.getElementById('sabotageFill').style.width = pct + '%';
        document.getElementById('sabotageHUD').textContent = 'REACTOR MELTDOWN - ' + Math.ceil(sabotage.timer / 60) + 's';
        if (sabotage.timer <= 0) {
          endGame(true);
          return;
        }
      }
      // Comms and lights have no timer - they stay until fixed
    }

    function fixSabotage() {
      if (!sabotage.active) return;
      const fixLoc = mapTheme.sabFix[sabotage.type];
      if (!fixLoc) return false;
      if (dist(player, fixLoc) < 80) {
        sabotage.fixProgress += 2;
        if (sabotage.fixProgress >= 100) {
          endSabotage();
          return true;
        }
      }
      return false;
    }

    function endSabotage() {
      sabotage.active = false;
      sabotage.type = null;
      sabotage.cooldown = SABOTAGE_COOLDOWN;
      visionRadius = VISION_NORMAL;
      document.getElementById('sabotageHUD').style.display = 'none';
      document.getElementById('sabotageBar').style.display = 'none';
    }

    // --- Vent System ---
    function getNearbyVent() {
      if (!isImpostor) return null;
      for (const v of vents) {
        if (dist(player, v) < 50) return v;
      }
      return null;
    }

    function enterVent() {
      if (!isImpostor || inVent || !player.alive) return;
      const vent = getNearbyVent();
      if (vent) {
        inVent = true;
        player.visible = false;
      }
    }

    function exitVent() {
      if (!inVent) return;
      inVent = false;
      player.visible = true;
    }

    function ventTravel() {
      if (!inVent) return;
      const vent = getNearbyVent();
      if (vent) {
        const partner = vents[vent.partner];
        player.x = partner.x;
        player.y = partner.y;
      }
    }

    // --- Player Task Progress ---
    function startPlayerTask() {
      if (isImpostor || playerDoingTask) return;
      for (const task of taskLocations) {
        if (task.done) continue;
        if (dist(player, task) < 60) {
          playerDoingTask = true;
          playerTaskProgress = 0;
          currentPlayerTask = task;
          document.getElementById('taskProgress').style.display = 'block';
          return;
        }
      }
      // Fix sabotage with E
      if (sabotage.active) fixSabotage();
    }

    function updatePlayerTask() {
      if (!playerDoingTask) return;
      // Cancel if player moves
      const dx = (keys['w'] || keys['arrowup'] || keys['s'] || keys['arrowdown'] ||
                  keys['a'] || keys['arrowleft'] || keys['d'] || keys['arrowright']);
      if (dx) {
        cancelPlayerTask();
        return;
      }
      playerTaskProgress += 1.5;
      document.getElementById('taskProgressFill').style.width = playerTaskProgress + '%';
      if (playerTaskProgress >= 100) {
        currentPlayerTask.done = true;
        tasksCompleted++;
        updateTaskBar();
        cancelPlayerTask();
      }
    }

    function cancelPlayerTask() {
      playerDoingTask = false;
      playerTaskProgress = 0;
      currentPlayerTask = null;
      document.getElementById('taskProgress').style.display = 'none';
      document.getElementById('taskProgressFill').style.width = '0%';
    }

    // --- Emergency Meeting ---
    function callEmergency() {
      if (emergencyCooldown > 0 || gameOver || sabotage.active) return;
      if (dist(player, EMERGENCY_BTN) < 60) {
        emergencyCooldown = 1800; // 30s cooldown
        if (sabotage.active) endSabotage();
        document.getElementById('reportScreen').querySelector('h1').textContent = 'EMERGENCY MEETING';
        document.getElementById('reportScreen').style.display = 'flex';
        setTimeout(() => {
          document.getElementById('reportScreen').querySelector('h1').textContent = 'DEAD BODY REPORTED';
          document.getElementById('reportScreen').style.display = 'none';
          startVoting(null);
        }, 2000);
      }
    }

    function updatePlayer() {
      if (!player.alive) return;
      if (inVent) return; // can't move while in vent
      if (playerDoingTask) { updatePlayerTask(); return; }
      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy = -player.speed;
      if (keys['s'] || keys['arrowdown']) dy = player.speed;
      if (keys['a'] || keys['arrowleft']) dx = -player.speed;
      if (keys['d'] || keys['arrowright']) dx = player.speed;
      if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }
      if (dx !== 0 || dy !== 0) tryMove(player, dx, dy);
      player.x = Math.max(25, Math.min(MAP_W - player.w - 25, player.x));
      player.y = Math.max(25, Math.min(MAP_H - player.h - 25, player.y));
      if (killCooldown > 0) killCooldown--;
      if (emergencyCooldown > 0) emergencyCooldown--;
    }

    function checkInteractions() {
      const hint = document.getElementById('interactHint');
      const cdDisplay = document.getElementById('killCooldown');
      const ventHint = document.getElementById('ventHint');
      hint.style.display = 'none';
      ventHint.style.display = 'none';

      if (playerDoingTask) return;
      if (inVent) {
        hint.textContent = 'Press V to exit vent | E to travel to connected vent';
        hint.style.display = 'block';
        return;
      }

      if (!isImpostor) {
        // Sabotage fix hint
        if (sabotage.active) {
          const fixLoc = mapTheme.sabFix[sabotage.type];
          if (fixLoc && dist(player, fixLoc) < 80) {
            const label = sabotage.type === 'lights' ? 'Fix Lights' : 'Fix O2';
            hint.textContent = 'Hold E - ' + label + ' (' + Math.round(sabotage.fixProgress) + '%)';
            hint.style.display = 'block';
          }
        }
        for (const task of taskLocations) {
          if (task.done) continue;
          if (dist(player, task) < 60) {
            hint.textContent = 'Press E - ' + task.name;
            hint.style.display = 'block';
            break;
          }
        }
      }

      // Security camera monitor
      if (selectedMap === 'skeld' && cameras.length > 0 && dist(player, SECURITY_MONITOR) < 70) {
        if (sabotage.active && sabotage.type === 'comms') {
          hint.textContent = 'Cameras disabled (Comms Sabotaged)';
          hint.style.display = 'block';
        } else {
          hint.textContent = viewingCameras ? 'Press E - Stop viewing cameras' : 'Press E - View Security Cameras';
          hint.style.display = 'block';
        }
      }

      // Emergency meeting button
      if (dist(player, EMERGENCY_BTN) < 60 && emergencyCooldown <= 0 && !sabotage.active) {
        ventHint.textContent = 'Press E near button - Emergency Meeting';
        ventHint.style.display = 'block';
      }

      if (isImpostor) {
        // Sabotage controls
        const sabControls = document.getElementById('sabotageControls');
        if (!sabotage.active && sabotage.cooldown <= 0) {
          sabControls.style.display = 'flex';
        } else {
          sabControls.style.display = 'none';
        }

        // Door close hint
        const doorRoom = getNearbyDoorRoom();
        if (doorRoom && doorCooldown <= 0) {
          ventHint.textContent = 'Press C - Close ' + doorRoom + ' doors';
          ventHint.style.display = 'block';
        } else if (doorCooldown > 0 && doorRoom) {
          ventHint.textContent = 'Door cooldown: ' + Math.ceil(doorCooldown / 60) + 's';
          ventHint.style.display = 'block';
        }

        // Vent hint
        const nearVent = getNearbyVent();
        if (nearVent && !inVent) {
          ventHint.textContent = 'Press V - Enter Vent';
          ventHint.style.display = 'block';
        }

        if (killCooldown > 0) {
          cdDisplay.style.display = 'block';
          cdDisplay.textContent = 'Kill cooldown: ' + Math.ceil(killCooldown / 60) + 's';
        } else {
          cdDisplay.style.display = 'none';
          for (const npc of npcs) {
            if (npc.alive && !npc.isImpostor && dist(player, npc) < 60) {
              hint.textContent = 'Press SPACE - Kill ' + npc.name;
              hint.style.display = 'block';
              break;
            }
          }
        }
      }

      for (const body of deadBodies) {
        if (dist(player, body) < 80) {
          hint.textContent = 'Press R - Report Body';
          hint.style.display = 'block';
          break;
        }
      }
    }

    function doTask() {
      if (playerDoingTask) return;
      // Security camera monitor toggle
      if (selectedMap === 'skeld' && cameras.length > 0 && dist(player, SECURITY_MONITOR) < 70) {
        if (!sabotage.active || sabotage.type !== 'comms') {
          viewingCameras = !viewingCameras;
          return;
        }
      }
      // Emergency meeting button in cafeteria
      if (dist(player, EMERGENCY_BTN) < 60 && emergencyCooldown <= 0 && !sabotage.active) {
        callEmergency();
        return;
      }
      // Fix sabotage
      if (!isImpostor && sabotage.active) {
        if (fixSabotage()) return;
      }
      if (isImpostor) return;
      startPlayerTask();
    }

    function doKill() {
      if (!isImpostor || killCooldown > 0 || inVent) return;
      for (const npc of npcs) {
        if (npc.alive && !npc.isImpostor && dist(player, npc) < 60) {
          npc.alive = false;
          deadBodies.push({ x: npc.x, y: npc.y, color: npc.color, name: npc.name });
          killCooldown = 600;
          killFlash = 15; // red flash effect
          const aliveCrewmates = npcs.filter(n => n.alive && !n.isImpostor).length;
          const aliveImpostors = npcs.filter(n => n.alive && n.isImpostor).length + 1;
          if (aliveImpostors >= aliveCrewmates) endGame(true);
          break;
        }
      }
    }

    function reportBody() {
      for (const body of deadBodies) {
        if (dist(player, body) < 80) {
          document.getElementById('reportScreen').style.display = 'flex';
          setTimeout(() => {
            document.getElementById('reportScreen').style.display = 'none';
            startVoting(null);
          }, 2000);
          break;
        }
      }
    }

    function startVoting(reporterNPC) {
      const voteScreen = document.getElementById('voteScreen');
      const voteList = document.getElementById('voteList');
      const voteResult = document.getElementById('voteResult');
      voteResult.textContent = '';
      voteList.innerHTML = '';

      const candidates = [];
      if (player.alive) candidates.push({ name: player.name, color: player.color, isImpostor: player.isImpostor, isPlayer: true, entity: player });
      for (const npc of npcs) {
        if (npc.alive) candidates.push({ name: npc.name, color: npc.color, isImpostor: npc.isImpostor, isPlayer: false, entity: npc });
      }

      // NPC voting logic - each NPC votes
      const npcVotes = {};
      candidates.forEach(c => npcVotes[c.name] = 0);
      npcVotes['skip'] = 0;

      for (const npc of npcs) {
        if (!npc.alive || npc.isImpostor) continue;

        // Crewmate NPCs vote based on suspicion
        let maxSuspicion = 0;
        let suspect = null;
        for (const c of candidates) {
          if (c.entity === npc) continue;
          const susp = npc.suspicion[c.name] || 0;
          if (susp > maxSuspicion) {
            maxSuspicion = susp;
            suspect = c.name;
          }
        }

        if (suspect && maxSuspicion > 10) {
          npcVotes[suspect]++;
        } else {
          // Random vote or skip
          if (Math.random() < 0.4) {
            npcVotes['skip']++;
          } else {
            const others = candidates.filter(c => c.entity !== npc);
            if (others.length > 0) {
              const pick = others[Math.floor(Math.random() * others.length)];
              npcVotes[pick.name]++;
            }
          }
        }
      }

      // Impostor NPC votes for a random crewmate
      for (const npc of npcs) {
        if (!npc.alive || !npc.isImpostor) continue;
        const crewCandidates = candidates.filter(c => !c.isImpostor && c.entity !== npc);
        if (crewCandidates.length > 0) {
          const pick = crewCandidates[Math.floor(Math.random() * crewCandidates.length)];
          npcVotes[pick.name]++;
        }
      }

      // Show vote buttons for player
      candidates.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'vote-btn';
        btn.innerHTML = '<div class="vote-dot" style="background:' + c.color + '"></div>' + c.name +
          '<span class="vote-count">' + (npcVotes[c.name] || 0) + ' votes</span>';
        btn.onclick = () => {
          // Add player vote
          npcVotes[c.name] = (npcVotes[c.name] || 0) + 1;
          resolveVote(candidates, npcVotes);
        };
        voteList.appendChild(btn);
      });

      const skipBtn = document.createElement('button');
      skipBtn.className = 'vote-btn';
      skipBtn.innerHTML = '<div class="vote-dot" style="background:#555"></div>Skip Vote' +
        '<span class="vote-count">' + npcVotes['skip'] + ' votes</span>';
      skipBtn.onclick = () => {
        npcVotes['skip']++;
        resolveVote(candidates, npcVotes);
      };
      voteList.appendChild(skipBtn);

      voteScreen.style.display = 'flex';
    }

    function resolveVote(candidates, votes) {
      const voteList = document.getElementById('voteList');
      const voteResult = document.getElementById('voteResult');
      const voteScreen = document.getElementById('voteScreen');
      voteList.style.display = 'none';

      // Find who got most votes
      let maxVotes = votes['skip'];
      let ejected = null;
      for (const c of candidates) {
        if ((votes[c.name] || 0) > maxVotes) {
          maxVotes = votes[c.name];
          ejected = c;
        }
      }

      // Check for tie with skip
      if (!ejected || votes['skip'] >= maxVotes) {
        voteResult.textContent = 'No one was ejected. (Tie/Skipped)';
        setTimeout(() => {
          voteScreen.style.display = 'none';
          voteList.style.display = 'flex';
          deadBodies = [];
        }, 2500);
        return;
      }

      voteResult.innerHTML = '<span style="color:' + ejected.color + '">' + ejected.name + '</span> was ejected.<br><br>' +
        (ejected.isImpostor ?
          '<span style="color:#4ecdc4">' + ejected.name + ' was the Impostor.</span>' :
          '<span style="color:#ff4444">' + ejected.name + ' was not the Impostor.</span>');

      // Apply ejection
      if (ejected.isPlayer) {
        player.alive = false;
        if (ejected.isImpostor) {
          setTimeout(() => { voteScreen.style.display = 'none'; endGame(false); }, 3000);
        } else {
          setTimeout(() => { voteScreen.style.display = 'none'; endGame(true); }, 3000);
        }
      } else {
        const npc = npcs.find(n => n.name === ejected.name);
        if (npc) npc.alive = false;
        if (ejected.isImpostor) {
          setTimeout(() => { voteScreen.style.display = 'none'; endGame(false); }, 3000);
        } else {
          setTimeout(() => {
            voteScreen.style.display = 'none';
            voteList.style.display = 'flex';
            deadBodies = [];
            // Reset suspicion
            npcs.forEach(n => { n.sawBody = false; n.bodyLocation = null; });
            const aliveCrewmates = npcs.filter(n => n.alive && !n.isImpostor).length + (player.alive && !isImpostor ? 1 : 0);
            const aliveImpostors = npcs.filter(n => n.alive && n.isImpostor).length + (player.alive && isImpostor ? 1 : 0);
            if (aliveImpostors >= aliveCrewmates) endGame(true);
          }, 3000);
        }
      }
    }

    function endGame(impostorWins) {
      gameOver = true;
      const title = document.getElementById('winTitle');
      const desc = document.getElementById('winDesc');
      if (impostorWins) {
        title.textContent = 'IMPOSTOR WINS';
        title.style.color = '#ff4444';
        desc.textContent = isImpostor ? 'You eliminated the crew!' : 'The impostor got away...';
      } else {
        title.textContent = 'CREWMATES WIN';
        title.style.color = '#4ecdc4';
        desc.textContent = isImpostor ? 'You were caught!' : 'The ship is safe!';
      }
      document.getElementById('gameOverScreen').style.display = 'flex';
    }

    // Drawing
    function drawCrewmate(ctx, x, y, w, h, color, name, alive, state) {
      if (!alive) return;
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h + 2, w / 2, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      // Body
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h * 0.55, w / 2, h * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      // Visor
      ctx.fillStyle = '#9cd8f7';
      ctx.beginPath();
      ctx.ellipse(x + w * 0.65, y + h * 0.35, w * 0.22, h * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
      // Visor shine
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.ellipse(x + w * 0.7, y + h * 0.3, w * 0.08, h * 0.06, 0, 0, Math.PI * 2);
      ctx.fill();
      // Backpack
      ctx.fillStyle = color;
      ctx.fillRect(x - 6, y + h * 0.35, 8, h * 0.3);
      // Legs
      ctx.fillRect(x + 4, y + h * 0.85, 10, 8);
      ctx.fillRect(x + w - 14, y + h * 0.85, 10, 8);
      // Name
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(name, x + w / 2, y - 8);
      // Task indicator
      if (state === AI_STATE.DOING_TASK || state === AI_STATE.FAKING_TASK) {
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 14px Arial';
        ctx.fillText('...', x + w / 2, y - 22);
      }
    }

    function drawDeadBody(ctx, x, y, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(x + 16, y + 25, 16, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ddd';
      ctx.beginPath();
      ctx.ellipse(x + 35, y + 15, 5, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(x + 30, y + 20, 3, 8);
    }

    // ====== TEXTURE & DECORATION SYSTEM ======
